name: Pages

on:
  push:
    branches:
      - main  # default branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # If your repository depends on submodule, please see: https://github.com/actions/checkout
          submodules: recursive
          # 完整历史：构建前要从 git 还原文章 mtime（见下一步），浅克隆拿不到历史
          fetch-depth: 0
      # checkout 会把所有文件写为同一时刻，导致 updated_option: mtime 下
      # 每篇文章的「更新于」都坍缩成构建时刻。这里逐篇还原为该文件
      # 最后一次提交的时刻，让 Hexo 构建时读到真实的修改时间。
      - name: Restore posts mtime from git
        run: |
          git -c core.quotePath=false ls-files 'source/_posts/*.md' 'source/_posts/*/*.md' | while read -r f; do
            touch -d "$(git log -1 --format=%cI -- "$f")" "$f"
          done
      - name: Use Node.js 18.20.3
        uses: actions/setup-node@v4
        with:
          # Examples: 20, 18.19, >=16.20.2, lts/Iron, lts/Hydrogen, *, latest, current, node
          # Ref: https://github.com/actions/setup-node#supported-version-syntax
          node-version: '20'
      - name: Cache NPM dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.OS }}-npm-cache
          restore-keys: |
            ${{ runner.OS }}-npm-cache
      - name: Install Dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4