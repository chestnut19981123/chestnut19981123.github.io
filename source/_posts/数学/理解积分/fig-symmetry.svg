<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="Alibaba PuHuiTi, WenQuanYi Zen Hei, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow-both" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8864a"/>
    </marker>
  </defs>

  <!-- ===== 左面板：偶函数 · 偶倍 ===== -->
  <!-- 坐标轴：原点 (210, 255) -->
  <line x1="45"  y1="255" x2="350" y2="255" stroke="#3a3a3a" stroke-width="1.5"/>
  <line x1="210" y1="50"  x2="210" y2="255" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="345" y="273" font-size="13" fill="#3a3a3a">x</text>
  <text x="196" y="64"  font-size="13" fill="#3a3a3a">y</text>

  <!-- 半区间填充：[-a,0] 浅、[0,a] 主色半透明 -->
  <path d="M 90 255 L 90 175 C 110 100, 160 60, 210 60 L 210 255 Z" fill="#e8f2fa" stroke="none"/>
  <path d="M 210 255 L 210 60 C 260 60, 310 100, 330 175 L 330 255 Z" fill="#49b1f5" fill-opacity="0.22" stroke="none"/>

  <!-- 抛物线 y=x^2 -->
  <path d="M 90 175 C 115 90, 170 60, 210 60 C 250 60, 305 90, 330 175"
        fill="none" stroke="#49b1f5" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 区间端点 -->
  <line x1="90"  y1="255" x2="90"  y2="263" stroke="#3a3a3a" stroke-width="1.2"/>
  <line x1="330" y1="255" x2="330" y2="263" stroke="#3a3a3a" stroke-width="1.2"/>
  <text x="90"  y="278" text-anchor="middle" font-size="15" fill="#3a3a3a">−a</text>
  <text x="330" y="278" text-anchor="middle" font-size="15" fill="#3a3a3a">a</text>

  <!-- 奇偶标注 -->
  <text x="150" y="150" text-anchor="middle" font-size="14" fill="#2c6f9e">偶</text>
  <text x="270" y="150" text-anchor="middle" font-size="14" fill="#2c6f9e">偶</text>

  <text x="197" y="52" text-anchor="middle" font-size="20" fill="#3a3a3a">偶函数：偶倍</text>
  <text x="197" y="340" text-anchor="middle" font-size="15" fill="#2c6f9e">∫<tspan font-size="11">−a</tspan><tspan dy="4" font-size="11">a</tspan> f(x)dx = 2∫<tspan font-size="11">0</tspan><tspan dy="4" font-size="11">a</tspan> f(x)dx</text>

  <!-- ===== 右面板：奇函数 · 奇零 ===== -->
  <!-- 坐标轴：原点 (540, 205) -->
  <line x1="375" y1="205" x2="680" y2="205" stroke="#3a3a3a" stroke-width="1.5"/>
  <line x1="540" y1="50"  x2="540" y2="205" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="675" y="223" font-size="13" fill="#3a3a3a">x</text>
  <text x="526" y="64"  font-size="13" fill="#3a3a3a">y</text>

  <!-- 正负区域：左侧曲线与 x 轴之间为 +，右侧为 − -->
  <path d="M 420 205 L 420 80 C 460 95, 500 150, 540 205 L 420 205 Z" fill="#c9a96a" fill-opacity="0.25" stroke="none"/>
  <path d="M 540 205 C 580 150, 620 95, 660 80 L 660 205 L 540 205 Z" fill="#49b1f5" fill-opacity="0.22" stroke="none"/>

  <!-- 三次曲线 y=x^3 -->
  <path d="M 420 80 C 470 90, 505 165, 540 205 C 575 245, 610 320, 660 330"
        fill="none" stroke="#49b1f5" stroke-width="2.5" stroke-linecap="round"/>

  <line x1="420" y1="205" x2="420" y2="213" stroke="#3a3a3a" stroke-width="1.2"/>
  <line x1="660" y1="205" x2="660" y2="213" stroke="#3a3a3a" stroke-width="1.2"/>
  <text x="420" y="228" text-anchor="middle" font-size="15" fill="#3a3a3a">−a</text>
  <text x="660" y="228" text-anchor="middle" font-size="15" fill="#3a3a3a">a</text>

  <text x="460" y="140" text-anchor="middle" font-size="16" fill="#a8864a">+</text>
  <text x="620" y="290" text-anchor="middle" font-size="16" fill="#2c6f9e">−</text>

  <text x="527" y="52" text-anchor="middle" font-size="20" fill="#3a3a3a">奇函数：奇零</text>
  <text x="527" y="340" text-anchor="middle" font-size="15" fill="#2c6f9e">∫<tspan font-size="11">−a</tspan><tspan dy="4" font-size="11">a</tspan> f(x)dx = 0（正负相抵）</text>
</svg>
