<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="900"
     viewBox="0 0 1600 900">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24"
                    flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <marker id="arrow"
            viewBox="0 0 10 10"
            refX="8"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Soft abstract atmosphere -->
  <circle cx="1390" cy="80" r="210"
          fill="#bfdbfe" opacity="0.38" filter="url(#soft)"/>
  <circle cx="180" cy="790" r="180"
          fill="#bae6fd" opacity="0.28" filter="url(#soft)"/>

  <!-- Subtle coordinate/grid system -->
  <g stroke="#94a3b8" stroke-width="1" opacity="0.16">
    <path d="M80 150 H1520"/>
    <path d="M80 300 H1520"/>
    <path d="M80 450 H1520"/>
    <path d="M80 600 H1520"/>
    <path d="M80 750 H1520"/>

    <path d="M180 80 V820"/>
    <path d="M380 80 V820"/>
    <path d="M580 80 V820"/>
    <path d="M780 80 V820"/>
    <path d="M980 80 V820"/>
    <path d="M1180 80 V820"/>
    <path d="M1380 80 V820"/>
  </g>

  <!-- Main tensor: layered 3D array -->
  <g filter="url(#shadow)">

    <!-- Back layer -->
    <g transform="translate(610 190) skewY(-18)">
      <rect width="390" height="390"
            rx="18"
            fill="#dbeafe"
            stroke="#60a5fa"
            stroke-width="3"/>

      <!-- cells -->
      <g stroke="#93c5fd" stroke-width="2" fill="none">
        <path d="M130 0 V390"/>
        <path d="M260 0 V390"/>
        <path d="M0 130 H390"/>
        <path d="M0 260 H390"/>
      </g>
    </g>

    <!-- Middle layer -->
    <g transform="translate(500 245) skewY(-18)">
      <rect width="390" height="390"
            rx="18"
            fill="#bfdbfe"
            stroke="#3b82f6"
            stroke-width="3"/>

      <g stroke="#60a5fa" stroke-width="2">
        <path d="M130 0 V390"/>
        <path d="M260 0 V390"/>
        <path d="M0 130 H390"/>
        <path d="M0 260 H390"/>
      </g>
    </g>

    <!-- Front layer -->
    <g transform="translate(390 300)">
      <rect width="390" height="390"
            rx="18"
            fill="#ffffff"
            stroke="#2563eb"
            stroke-width="4"/>

      <g stroke="#bfdbfe" stroke-width="2">
        <path d="M130 0 V390"/>
        <path d="M260 0 V390"/>
        <path d="M0 130 H390"/>
        <path d="M0 260 H390"/>
      </g>

      <!-- Selected tensor cells -->
      <g fill="url(#blue)">
        <rect x="4" y="4" width="122" height="122" rx="10"/>
        <rect x="134" y="134" width="122" height="122" rx="10"/>
        <rect x="264" y="264" width="122" height="122" rx="10"/>
      </g>

      <!-- Small dimension markers -->
      <g fill="#ffffff" opacity="0.92">
        <circle cx="65" cy="65" r="9"/>
        <circle cx="195" cy="195" r="9"/>
        <circle cx="325" cy="325" r="9"/>
      </g>
    </g>
  </g>

  <!-- Dimension / axis lines -->
  <g fill="none"
     stroke="#2563eb"
     stroke-width="4"
     stroke-linecap="round"
     marker-end="url(#arrow)">

    <!-- axis -->
    <path d="M390 735 H785"/>
    <path d="M390 735 L275 650"/>
    <path d="M390 735 V305"/>
  </g>

  <!-- Axis labels as abstract symbols, not title text -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="30"
     font-weight="600"
     fill="#1d4ed8">

    <text x="805" y="748">axis</text>
    <text x="238" y="644">dim</text>
    <text x="365" y="275">shape</text>
  </g>

  <!-- Floating dimensional notation -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     fill="#475569">

    <text x="1030" y="310"
          font-size="25"
          font-weight="600">
      [ 2 × 3 × 3 ]
    </text>

    <text x="1030" y="355"
          font-size="19"
          opacity="0.72">
      dimension
    </text>

    <text x="1030" y="455"
          font-size="25"
          font-weight="600">
      A[i, j, k]
    </text>

    <text x="1030" y="500"
          font-size="19"
          opacity="0.72">
      index
    </text>
  </g>

  <!-- Minimal broadcasting / mapping motif -->
  <g transform="translate(1010 590)">
    <g fill="#ffffff" stroke="#94a3b8" stroke-width="2">
      <rect x="0" y="0" width="58" height="58" rx="10"/>
      <rect x="72" y="0" width="58" height="58" rx="10"/>
      <rect x="144" y="0" width="58" height="58" rx="10"/>
      <rect x="0" y="72" width="58" height="58" rx="10"/>
      <rect x="72" y="72" width="58" height="58" rx="10"/>
      <rect x="144" y="72" width="58" height="58" rx="10"/>
    </g>

    <g stroke="#2563eb"
       stroke-width="3"
       fill="none"
       marker-end="url(#arrow)">
      <path d="M230 65 H300"/>
      <path d="M230 137 H300"/>
    </g>

    <g fill="#dbeafe" stroke="#3b82f6" stroke-width="2">
      <rect x="320" y="0" width="58" height="58" rx="10"/>
      <rect x="320" y="72" width="58" height="58" rx="10"/>
      <rect x="392" y="0" width="58" height="58" rx="10"/>
      <rect x="392" y="72" width="58" height="58" rx="10"/>
    </g>
  </g>

  <!-- Decorative mathematical dots -->
  <g fill="#2563eb">
    <circle cx="1280" cy="180" r="5"/>
    <circle cx="1310" cy="180" r="5"/>
    <circle cx="1340" cy="180" r="5"/>
    <circle cx="1280" cy="210" r="5"/>
    <circle cx="1310" cy="210" r="5"/>
    <circle cx="1340" cy="210" r="5"/>
  </g>

  <!-- Thin contour lines -->
  <g fill="none" stroke="#64748b" stroke-width="2" opacity="0.28">
    <path d="M1120 120 C1240 70 1400 100 1490 190"/>
    <path d="M1090 145 C1220 95 1380 125 1470 215"/>
    <path d="M1080 730 C1210 680 1390 690 1500 770"/>
  </g>

</svg>