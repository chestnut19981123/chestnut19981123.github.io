<svg xmlns="http://www.w3.org/2000/svg"
 width="800"
 height="320"
 viewBox="0 0 800 320"
 font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'WenQuanYi Zen Hei', sans-serif"
 stroke-linecap="round"
 stroke-linejoin="round">

<defs>
<marker id="arr"
 markerHeight="7"
 markerWidth="7"
 orient="auto-start-reverse"
 refX="10"
 refY="5"
 viewBox="0 0 10 10">
<path fill="#64748b" d="M 0 0 L 10 5 L 0 10 z"/>
</marker>
</defs>

<!-- 顶部说明 -->
<text x="400" y="28"
 fill="#64748b"
 font-size="14"
 text-anchor="middle"
 dominant-baseline="middle">
上下层面包纹丝不动，只微分中间那块肉
</text>

<!-- 左侧微分标记 -->
<text x="72" y="160"
 fill="#1E293B"
 font-size="18"
 text-anchor="middle"
 dominant-baseline="middle"
 transform="rotate(-90 72 160)">
<tspan font-style="italic">d</tspan>(<tspan font-style="italic">A</tspan> <tspan font-style="italic">X</tspan> <tspan font-style="italic">B</tspan>)
</text>


<!-- 上层 A -->
<rect x="130" y="70"
 width="300"
 height="60"
 rx="28"
 fill="#FBF3DD"
 stroke="#C9A227"
 stroke-width="2.5"/>

<circle cx="190" cy="80" r="3.5" fill="#C9A227"/>
<circle cx="280" cy="80" r="3.5" fill="#C9A227"/>
<circle cx="370" cy="80" r="3.5" fill="#C9A227"/>


<!-- 中间 dX -->
<rect x="130" y="130"
 width="300"
 height="52"
 rx="14"
 fill="#FFF7ED"
 stroke="#F97316"
 stroke-width="2.5"/>


<!-- 下层 B -->
<rect x="130" y="182"
 width="300"
 height="60"
 rx="28"
 fill="#FBF3DD"
 stroke="#C9A227"
 stroke-width="2.5"/>


<!-- 文字 -->
<text x="280" y="100"
 fill="#9C7A1E"
 font-size="22"
 font-weight="700"
 text-anchor="middle"
 dominant-baseline="middle">
<tspan font-style="italic">A</tspan>
</text>

<text x="280" y="156"
 fill="#E8620C"
 font-size="20"
 font-weight="700"
 text-anchor="middle"
 dominant-baseline="middle">
<tspan font-style="italic">dX</tspan>
</text>

<text x="280" y="212"
 fill="#9C7A1E"
 font-size="22"
 font-weight="700"
 text-anchor="middle"
 dominant-baseline="middle">
<tspan font-style="italic">B</tspan>
</text>


<!-- 箭头 -->
<line x1="430" y1="156"
 x2="510" y2="156"
 stroke="#64748b"
 stroke-width="2.5"
 marker-end="url(#arr)"/>


<!-- 结果 -->
<rect x="510" y="128"
 width="240"
 height="56"
 rx="12"
 fill="#FFFFFF"
 stroke="#F97316"
 stroke-width="2.5"/>

<text x="630" y="156"
 fill="#1E293B"
 font-size="22"
 font-weight="600"
 text-anchor="middle"
 dominant-baseline="middle">
<tspan font-style="italic">A</tspan>
<tspan fill="#64748b"> · </tspan>
<tspan font-style="italic">dX</tspan>
<tspan fill="#64748b"> · </tspan>
<tspan font-style="italic">B</tspan>
</text>

</svg>