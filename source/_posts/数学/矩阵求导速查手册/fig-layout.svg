<svg xmlns="http://www.w3.org/2000/svg"
 width="800"
 height="360"
 viewBox="0 0 800 360"
 font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'WenQuanYi Zen Hei', sans-serif"
 stroke-linecap="round"
 stroke-linejoin="round">

<defs>
 <marker id="arr"
  markerHeight="7"
  markerWidth="7"
  orient="auto-start-reverse"
  refX="10"
  refY="5"
  viewBox="0 0 10 10">
  <path fill="#64748b" d="M 0 0 L 10 5 L 0 10 z"/>
 </marker>
</defs>

<!-- 顶部箭头 -->
<line x1="250" y1="32"
 x2="550" y2="32"
 stroke="#64748b"
 stroke-width="2.5"
 marker-start="url(#arr)"
 marker-end="url(#arr)"/>

<text x="400" y="56"
 fill="#1E293B"
 font-size="15"
 font-weight="600"
 text-anchor="middle"
 dominant-baseline="middle">
 互为转置
</text>


<!-- 左侧卡片 -->
<rect x="30" y="72"
 width="220"
 height="218"
 rx="16"
 fill="#FFFFFF"
 stroke="#C9A227"
 stroke-width="2.5"/>

<rect x="65" y="97"
 width="150"
 height="36"
 rx="10"
 fill="#C9A227"/>

<line x1="95" y1="102" x2="95" y2="128"
 stroke="#FFFFFF" stroke-width="1.5" opacity="0.55"/>
<line x1="125" y1="102" x2="125" y2="128"
 stroke="#FFFFFF" stroke-width="1.5" opacity="0.55"/>
<line x1="155" y1="102" x2="155" y2="128"
 stroke="#FFFFFF" stroke-width="1.5" opacity="0.55"/>
<line x1="185" y1="102" x2="185" y2="128"
 stroke="#FFFFFF" stroke-width="1.5" opacity="0.55"/>

<text x="140" y="260"
 fill="#9C7A1E"
 font-size="17"
 font-weight="600"
 text-anchor="middle"
 dominant-baseline="middle">
 行偏导 <tspan font-style="italic">D</tspan>
</text>

<text x="140" y="282"
 fill="#64748b"
 font-size="14"
 text-anchor="middle"
 dominant-baseline="middle">
 1 × <tspan font-style="italic">n</tspan>
</text>


<!-- 右侧卡片 -->
<rect x="550" y="72"
 width="220"
 height="218"
 rx="16"
 fill="#FFFFFF"
 stroke="#3B82F6"
 stroke-width="2.5"/>

<rect x="642" y="85"
 width="36"
 height="150"
 rx="10"
 fill="#3B82F6"/>

<line x1="648" y1="115" x2="672" y2="115"
 stroke="#FFFFFF" stroke-width="1.5" opacity="0.55"/>
<line x1="648" y1="145" x2="672" y2="145"
 stroke="#FFFFFF" stroke-width="1.5" opacity="0.55"/>
<line x1="648" y1="175" x2="672" y2="175"
 stroke="#FFFFFF" stroke-width="1.5" opacity="0.55"/>
<line x1="648" y1="205" x2="672" y2="205"
 stroke="#FFFFFF" stroke-width="1.5" opacity="0.55"/>

<text x="660" y="260"
 fill="#3B82F6"
 font-size="17"
 font-weight="600"
 text-anchor="middle"
 dominant-baseline="middle">
 列梯度 ∇
</text>

<text x="660" y="282"
 fill="#64748b"
 font-size="14"
 text-anchor="middle"
 dominant-baseline="middle">
 <tspan font-style="italic">n</tspan> × 1
</text>


<!-- 中间区域 -->
<rect x="330" y="72"
 width="140"
 height="178"
 rx="14"
 fill="#F8FAFC"
 stroke="#E2E8F0"
 stroke-width="1.5"/>

<text x="400" y="92"
 fill="#64748b"
 font-size="13"
 text-anchor="middle"
 dominant-baseline="middle">
 偏导内容
</text>

<text x="400" y="124"
 fill="#1E293B"
 font-size="15"
 text-anchor="middle"
 dominant-baseline="middle">
 ∂<tspan font-style="italic">f</tspan>/∂<tspan font-style="italic">x</tspan><tspan font-size="0.72em" baseline-shift="sub">1</tspan>
</text>

<line x1="342" y1="142"
 x2="458" y2="142"
 stroke="#E2E8F0"
 stroke-width="1"/>

<text x="400" y="162"
 fill="#1E293B"
 font-size="15"
 text-anchor="middle"
 dominant-baseline="middle">
 ∂<tspan font-style="italic">f</tspan>/∂<tspan font-style="italic">x</tspan><tspan font-size="0.72em" baseline-shift="sub">2</tspan>
</text>

<line x1="342" y1="180"
 x2="458" y2="180"
 stroke="#E2E8F0"
 stroke-width="1"/>

<text x="400" y="200"
 fill="#64748b"
 font-size="15"
 text-anchor="middle"
 dominant-baseline="middle">
 ⋯
</text>

<line x1="342" y1="218"
 x2="458" y2="218"
 stroke="#E2E8F0"
 stroke-width="1"/>

<text x="400" y="238"
 fill="#1E293B"
 font-size="15"
 text-anchor="middle"
 dominant-baseline="middle">
 ∂<tspan font-style="italic">f</tspan>/∂<tspan font-style="italic">x</tspan><tspan font-size="0.72em" baseline-shift="sub">n</tspan>
</text>


<!-- 左右连接箭头 -->
<line x1="330" y1="161"
 x2="250" y2="161"
 stroke="#64748b"
 stroke-width="2.5"
 marker-end="url(#arr)"/>

<line x1="470" y1="161"
 x2="550" y2="161"
 stroke="#64748b"
 stroke-width="2.5"
 marker-end="url(#arr)"/>

</svg>