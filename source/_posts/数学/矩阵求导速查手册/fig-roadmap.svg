<svg xmlns="http://www.w3.org/2000/svg"
     width="800"
     height="240"
     viewBox="0 0 800 240"
     font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',system-ui,sans-serif"
     text-rendering="geometricPrecision"
     stroke-linecap="round"
     stroke-linejoin="round">

<defs>
  <marker id="arr"
          markerHeight="7"
          markerWidth="7"
          orient="auto-start-reverse"
          refX="10"
          refY="5"
          viewBox="0 0 10 10">
    <path fill="#64748b" d="M 0 0 L 10 5 L 0 10 z"/>
  </marker>
</defs>

<!-- 1 -->
<rect x="54" y="80" width="140" height="80" rx="16"
      fill="#FBF3DD" stroke="#C9A227" stroke-width="2.5"/>

<circle cx="90" cy="120" r="22"
        fill="#FFFFFF" stroke="#C9A227" stroke-width="2"/>

<text x="90" y="120"
      fill="#9C7A1E"
      font-size="20"
      font-weight="700"
      text-anchor="middle"
      dominant-baseline="middle">1</text>

<text x="155" y="120"
      fill="#1E293B"
      font-size="15"
      font-weight="600"
      text-anchor="middle"
      dominant-baseline="middle"
      dy="0.12em">认形状</text>


<!-- 2 -->
<rect x="238" y="80" width="140" height="80" rx="16"
      fill="#FBF3DD" stroke="#C9A227" stroke-width="2.5"/>

<circle cx="274" cy="120" r="22"
        fill="#FFFFFF" stroke="#C9A227" stroke-width="2"/>

<text x="274" y="120"
      fill="#9C7A1E"
      font-size="20"
      font-weight="700"
      text-anchor="middle"
      dominant-baseline="middle">2</text>

<text x="339" y="120"
      fill="#1E293B"
      font-size="13.5"
      font-weight="600"
      text-anchor="middle"
      dominant-baseline="middle"
      dy="0.12em">记公式</text>


<!-- 3 -->
<rect x="422" y="80" width="140" height="80" rx="16"
      fill="#FBF3DD" stroke="#C9A227" stroke-width="2.5"/>

<circle cx="458" cy="120" r="22"
        fill="#FFFFFF" stroke="#C9A227" stroke-width="2"/>

<text x="458" y="120"
      fill="#9C7A1E"
      font-size="20"
      font-weight="700"
      text-anchor="middle"
      dominant-baseline="middle">3</text>

<text x="523" y="120"
      fill="#1E293B"
      font-size="13.5"
      font-weight="600"
      text-anchor="middle"
      dominant-baseline="middle"
      dy="0.12em">配法则</text>


<!-- 4 -->
<rect x="606" y="80" width="140" height="80" rx="16"
      fill="#FBF3DD" stroke="#C9A227" stroke-width="2.5"/>

<circle cx="642" cy="120" r="22"
        fill="#FFFFFF" stroke="#C9A227" stroke-width="2"/>

<text x="642" y="120"
      fill="#9C7A1E"
      font-size="20"
      font-weight="700"
      text-anchor="middle"
      dominant-baseline="middle">4</text>

<text x="707" y="120"
      fill="#1E293B"
      font-size="15"
      font-weight="600"
      text-anchor="middle"
      dominant-baseline="middle"
      dy="0.12em">可推导</text>


<!-- arrows -->
<line x1="194" y1="120"
      x2="238" y2="120"
      stroke="#64748b"
      stroke-width="2.5"
      marker-end="url(#arr)"/>

<line x1="378" y1="120"
      x2="422" y2="120"
      stroke="#64748b"
      stroke-width="2.5"
      marker-end="url(#arr)"/>

<line x1="562" y1="120"
      x2="606" y2="120"
      stroke="#64748b"
      stroke-width="2.5"
      marker-end="url(#arr)"/>

</svg>