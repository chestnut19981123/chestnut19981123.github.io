<svg width="1792" height="1024" viewBox="0 0 1792 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1792" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E8EEF7"/>
    </linearGradient>

    <linearGradient id="curve1" x1="260" y1="760" x2="1500" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="curve2" x1="320" y1="300" x2="1450" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1792" height="1024" fill="url(#bg)"/>

  <!-- Soft ambient glow -->
  <circle cx="420" cy="250" r="180" fill="#93C5FD" opacity="0.25" filter="url(#blur)"/>
  <circle cx="1380" cy="760" r="220" fill="#C4B5FD" opacity="0.22" filter="url(#blur)"/>

  <!-- Abstract Bezier shadow -->
  <path d="M260 760 C520 120 980 950 1510 250"
        stroke="#94A3B8"
        stroke-width="32"
        opacity="0.25"
        filter="url(#shadow)"
        fill="none"/>

  <!-- Main Bezier curve -->
  <path d="M260 760 C520 120 980 950 1510 250"
        stroke="url(#curve1)"
        stroke-width="10"
        stroke-linecap="round"
        fill="none"/>

  <!-- Secondary curve -->
  <path d="M350 300 C720 820 1100 120 1460 720"
        stroke="url(#curve2)"
        stroke-width="6"
        stroke-linecap="round"
        opacity="0.65"
        fill="none"/>

  <!-- Control points -->
  <circle cx="260" cy="760" r="12" fill="#2563EB"/>
  <circle cx="1510" cy="250" r="12" fill="#06B6D4"/>
  <circle cx="350" cy="300" r="8" fill="#0EA5E9"/>
  <circle cx="1460" cy="720" r="8" fill="#8B5CF6"/>

  <!-- Minimal geometric accents -->
  <path d="M220 220 L300 220 L300 300"
        stroke="#CBD5E1"
        stroke-width="3"
        fill="none"/>

  <path d="M1490 820 L1570 820 L1570 740"
        stroke="#CBD5E1"
        stroke-width="3"
        fill="none"/>

  <!-- Small nodes -->
  <circle cx="900" cy="512" r="5" fill="#64748B" opacity="0.6"/>
  <circle cx="900" cy="512" r="22" stroke="#94A3B8" opacity="0.25" stroke-width="2"/>

</svg>