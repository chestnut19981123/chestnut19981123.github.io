<svg width="1792" height="1024" viewBox="0 0 1792 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1792" y2="1024">
    <stop stop-color="#F8FAFC"/>
    <stop offset="0.5" stop-color="#EFF6FF"/>
    <stop offset="1" stop-color="#F5F3FF"/>
  </linearGradient>

  <linearGradient id="line" x1="300" y1="200" x2="1500" y2="800">
    <stop stop-color="#2563EB"/>
    <stop offset="0.5" stop-color="#06B6D4"/>
    <stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop stop-color="#93C5FD" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#93C5FD" stop-opacity="0"/>
  </radialGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="55"/>
  </filter>
</defs>

<!-- background -->
<rect width="1792" height="1024" fill="url(#bg)"/>

<!-- soft light -->
<circle cx="320" cy="240" r="260" fill="url(#glow)" filter="url(#blur)"/>
<circle cx="1500" cy="760" r="300" fill="url(#glow)" filter="url(#blur)"/>

<!-- large abstract neural network -->
<g stroke="url(#line)" stroke-width="4" opacity="0.55">
  <path d="M330 420L560 260L820 360L1080 220L1370 380L1540 300"/>
  <path d="M560 260L650 560L820 360L980 620L1370 380"/>
  <path d="M650 560L420 720L760 820L980 620L1420 720"/>
  <path d="M1080 220L1260 600"/>
  <path d="M820 360L1260 600"/>
</g>

<!-- neural nodes -->
<g fill="#FFFFFF" stroke="url(#line)" stroke-width="6">
  <circle cx="330" cy="420" r="22"/>
  <circle cx="560" cy="260" r="30"/>
  <circle cx="820" cy="360" r="34"/>
  <circle cx="1080" cy="220" r="25"/>
  <circle cx="1370" cy="380" r="32"/>
  <circle cx="1540" cy="300" r="20"/>
  <circle cx="650" cy="560" r="28"/>
  <circle cx="980" cy="620" r="35"/>
  <circle cx="1260" cy="600" r="24"/>
  <circle cx="420" cy="720" r="20"/>
  <circle cx="760" cy="820" r="26"/>
  <circle cx="1420" cy="720" r="22"/>
</g>

<!-- small surrounding nodes -->
<g fill="#60A5FA" opacity="0.8">
  <circle cx="230" cy="300" r="8"/>
  <circle cx="280" cy="340" r="5"/>
  <circle cx="1640" cy="460" r="8"/>
  <circle cx="1580" cy="520" r="5"/>
  <circle cx="520" cy="850" r="7"/>
  <circle cx="1320" cy="850" r="6"/>
</g>

<!-- abstract AI wave -->
<path d="M260 570C520 430 760 450 980 570C1200 690 1420 650 1600 520"
      stroke="#93C5FD"
      stroke-width="3"
      opacity="0.35"
      fill="none"/>

<path d="M260 600C520 460 760 480 980 600C1200 720 1420 680 1600 550"
      stroke="#C4B5FD"
      stroke-width="2"
      opacity="0.35"
      fill="none"/>

<!-- decorative geometric elements -->
<g stroke="#94A3B8" opacity="0.3" fill="none">
  <path d="M140 180L240 120L340 180L240 240Z"/>
  <circle cx="240" cy="180" r="35"/>
  <path d="M1450 120L1580 80L1690 170L1560 220Z"/>
  <path d="M150 850H420V900H700"/>
  <path d="M1200 120H1600V180"/>
</g>

<!-- tiny particles -->
<g fill="#38BDF8">
  <circle cx="390" cy="180" r="4"/>
  <circle cx="900" cy="160" r="5"/>
  <circle cx="1460" cy="820" r="5"/>
  <circle cx="1700" cy="700" r="4"/>
</g>

</svg>