<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430">

<defs>
  <marker id="arr"
          markerHeight="9"
          markerWidth="9"
          orient="auto-start-reverse"
          refX="8"
          refY="5"
          viewBox="0 0 10 10">
    <path fill="#64748b" d="M 0 0 L 10 5 L 0 10 z"/>
  </marker>
</defs>

<!-- 分隔线 -->
<line x1="400" x2="400"
      y1="40" y2="400"
      stroke="#cbd5e1"
      stroke-width="2"
      stroke-dasharray="8 6"/>


<!-- 标题 -->
<text x="200" y="32"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
      font-size="20"
      text-anchor="middle"
      style="font-weight:600">
普通 LLM 对话
</text>

<text x="600" y="32"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
      font-size="20"
      text-anchor="middle"
      style="font-weight:600">
Agent
</text>


<!-- ================= 左侧 LLM ================= -->

<rect width="280" height="70"
      x="60" y="90"
      fill="#eff6ff"
      stroke="#3b82f6"
      stroke-width="2.5"
      rx="14"/>

<text x="200" y="118"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
      font-size="19"
      text-anchor="middle"
      style="font-weight:600">
用户发一条消息
</text>

<text x="200" y="141"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
      font-size="14"
      text-anchor="middle">
「帮我写个 hello world」
</text>


<rect width="280" height="70"
      x="60" y="220"
      fill="#f8fafc"
      stroke="#334155"
      stroke-width="2.5"
      rx="14"/>

<text x="200" y="248"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
      font-size="19"
      text-anchor="middle"
      style="font-weight:600">
模型给个答案
</text>

<text x="200" y="271"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
      font-size="14"
      text-anchor="middle">
打完收工，一轮结束
</text>


<line x1="200" x2="200"
      y1="160" y2="220"
      stroke="#64748b"
      stroke-width="2.5"
      marker-end="url(#arr)"/>



<!-- ================= 右侧 Agent ================= -->

<rect width="280" height="70"
      x="460" y="90"
      fill="#eff6ff"
      stroke="#3b82f6"
      stroke-width="2.5"
      rx="14"/>

<text x="600" y="118"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
      font-size="19"
      text-anchor="middle"
      style="font-weight:600">
用户发一个任务
</text>

<text x="600" y="141"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
      font-size="14"
      text-anchor="middle">
「帮我修个 bug」
</text>



<rect width="280" height="70"
      x="460" y="200"
      fill="#fff7ed"
      stroke="#f97316"
      stroke-width="2.5"
      rx="14"/>

<text x="600" y="228"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
      font-size="19"
      text-anchor="middle"
      style="font-weight:600">
循环：推理 → 工具 → 观察
</text>

<text x="600" y="251"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif
"
      font-size="14"
      text-anchor="middle">
未完成则继续下一轮
</text>



<rect width="280" height="70"
      x="460" y="310"
      fill="#f0fdf4"
      stroke="#22c55e"
      stroke-width="2.5"
      rx="14"/>

<text x="600" y="338"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
      font-size="19"
      text-anchor="middle"
      style="font-weight:600">
任务完成
</text>

<text x="600" y="361"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
      font-size="14"
      text-anchor="middle">
满足终止条件
</text>



<!-- 用户进入 Agent -->
<line x1="600" x2="600"
      y1="160" y2="200"
      stroke="#f97316"
      stroke-width="2.5"
      marker-end="url(#arr)"/>


<!-- 循环到完成 -->
<line x1="600" x2="600"
      y1="270" y2="310"
      stroke="#64748b"
      stroke-width="2.5"
      marker-end="url(#arr)"/>


<!-- 右侧循环回环 -->
<path d="
M740 235
C790 235, 790 160, 760 140
C720 110, 650 120, 620 170"
fill="none"
stroke="#64748b"
stroke-width="2.5"
marker-end="url(#arr)"/>


<text x="770" y="190"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
      font-size="14"
      text-anchor="middle">
未完成
</text>


</svg>