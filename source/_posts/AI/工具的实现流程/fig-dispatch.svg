<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" preserveAspectRatio="xMidYMid meet" viewBox="0 0 800 430"><defs><marker id="arr" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#64748b" d="M0,0 L8,4 L0,8 Z"/></marker></defs><rect width="800" height="430" fill="#fff"/><text x="400" y="30" fill="#1e293b" dy=".35em" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="middle" style="font-weight:700">一次 dispatch 的安检之旅</text><text x="400" y="56" fill="#64748b" dy=".35em" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" text-anchor="middle">四道关卡，谁也别想插队</text><rect width="340" height="56" x="230" y="82" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="14"/><text x="400" y="104" fill="#1e293b" dy=".35em" font-family="monospace" font-size="15" text-anchor="middle" style="font-weight:700">ToolCall</text><text x="400" y="126" fill="#64748b" dy=".35em" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" text-anchor="middle">模型 tool_use JSON，进入 dispatch</text><rect width="165" height="88" x="35" y="170" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="14"/><text x="117" y="194" fill="#1e293b" dy=".35em" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" text-anchor="middle" style="font-weight:700">① 找工具</text><text x="117" y="216" fill="#1e293b" dy=".35em" font-family="monospace" font-size="11" text-anchor="middle">resolve_tool</text><text x="117" y="238" fill="#64748b" dy=".35em" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" text-anchor="middle">找不到 → 报错返回</text><line x1="200" x2="225" y1="214" y2="214" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/><rect width="165" height="88" x="225" y="170" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="14"/><text x="307" y="194" fill="#1e293b" dy=".35em" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" text-anchor="middle" style="font-weight:700">② 语义强转</text><text x="307" y="216" fill="#1e293b" dy=".35em" font-family="monospace" font-size="11" text-anchor="middle">validate_input</text><text x="307" y="238" fill="#64748b" dy=".35em" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" text-anchor="middle">&quot;true&quot; → True，清洗输入</text><line x1="390" x2="415" y1="214" y2="214" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/><rect width="165" height="88" x="415" y="170" fill="#fff7ed" stroke="#f97316" stroke-width="2" rx="14"/><text x="497" y="194" fill="#1e293b" dy=".35em" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" text-anchor="middle" style="font-weight:700">③ 权限三态</text><text x="497" y="216" fill="#1e293b" dy=".35em" font-family="monospace" font-size="11" text-anchor="middle">has_permissions</text><text x="497" y="238" fill="#64748b" dy=".35em" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" text-anchor="middle">allow / deny / ask</text><line x1="580" x2="605" y1="214" y2="214" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/><rect width="165" height="88" x="605" y="170" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="14"/><text x="687" y="194" fill="#1e293b" dy=".35em" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" text-anchor="middle" style="font-weight:700">④ 执行 call</text><text x="687" y="216" fill="#1e293b" dy=".35em" font-family="monospace" font-size="11" text-anchor="middle">call(input, ctx)</text><text x="687" y="238" fill="#64748b" dy=".35em" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" text-anchor="middle">ToolResult 回填对话</text><rect width="640" height="56" x="80" y="304" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="14"/><text x="400" y="326" fill="#1e293b" dy=".35em" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" text-anchor="middle" style="font-weight:700">plan 模式写文件直接拒（临时路径除外）· 自定义 validate_input 还能加关卡</text><text x="400" y="348" fill="#64748b" dy=".35em" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" text-anchor="middle">所有工具共用这一套 dispatch 检查流程</text><text x="400" y="404" fill="#1e293b" dy=".35em" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" text-anchor="middle" style="font-weight:700">新工具零成本获得：校验、权限、并发控制</text></svg>