<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430"><defs><marker id="arr" markerHeight="5" markerWidth="5" orient="auto" refX="4.5" refY="2.5"><path fill="#64748b" d="M0,0 L5,2.5 L0,5 Z"/></marker></defs><rect width="800" height="430" fill="#fff"/><text x="400" y="32" fill="#1e293b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" text-anchor="middle" style="font-weight:700">分词管线：两套引擎，各干各的</text><rect width="720" height="58" x="40" y="66" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="14"/><text x="400" y="90" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="17" text-anchor="middle" style="font-weight:700">浏览器 automation BrowserPlaywright 123 …</text><text x="400" y="111" fill="#64748b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" text-anchor="middle">一行原始文本：中英混杂，还有驼峰和数字</text><line x1="400" x2="400" y1="124" y2="152" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/><rect width="720" height="42" x="40" y="152" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="14"/><text x="400" y="173" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="16" text-anchor="middle" style="font-weight:700">_segment_text：扫描全文，把连续同字符段归给对应处理器</text><line x1="180" x2="150" y1="194" y2="214" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/><line x1="400" x2="400" y1="194" y2="214" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/><line x1="620" x2="650" y1="194" y2="214" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/><rect width="220" height="96" x="40" y="214" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="14"/><text x="150" y="238" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="16" text-anchor="middle" style="font-weight:700">LatinProcessor</text><text x="150" y="260" fill="#64748b" dominant-baseline="middle" fon