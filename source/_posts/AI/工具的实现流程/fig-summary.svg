<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430">

<defs>
      <marker id="arr"
            markerWidth="5"
            markerHeight="5"
            refX="4.5"
            refY="2.5"
            orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z"
            fill="#64748b"/>
      </marker>
</defs>

<rect width="800" height="430" fill="#ffffff"/>
<!-- 标题 -->
<text x="400" y="30"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="22"
      text-anchor="middle"
      style="font-weight:700">
SkillSearch 的全文地图
</text>

<text x="400" y="52"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="13"
      text-anchor="middle">
一层算法，一层工具，一层入口
</text>

<!-- ================= 第 1 层：服务层 ================= -->

<rect width="640" height="74"
      x="80" y="70"
      fill="#eff6ff"
      stroke="#3b82f6"
      stroke-width="2"
      rx="14"/>

<text x="100" y="86"
      fill="#3b82f6"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="12"
      text-anchor="start"
      style="font-weight:700">
第 1 章 · 服务层
</text>

<text x="400" y="112"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="14"
      text-anchor="middle"
      style="font-weight:700">
Skill 文档 → 分词 → TF-IDF 索引 → SkillSearcher 单例
</text>

<text x="400" y="132"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="11"
      text-anchor="middle">
纯算法：不认识工具系统，也不认识命令系统
</text>

<line x1="400" x2="400" y1="144" y2="160"
      stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

<!-- ================= 第 2 层：工具层 ================= -->

<rect width="640" height="74"
      x="80" y="160"
      fill="#f8fafc"
      stroke="#334155"
      stroke-width="2"
      rx="14"/>

<text x="100" y="176"
      fill="#334155"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="12"
      text-anchor="start"
      style="font-weight:700">
第 2 章 · 工具层
</text>

<text x="400" y="202"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="14"
      text-anchor="middle"
      style="font-weight:700">
build_tool 薄壳 + ALL_STATIC_TOOLS 一行 → ToolRegistry
</text>

<text x="400" y="222"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="11"
      text-anchor="middle">
声明 + 登记，两步完事，之后全自动
</text>

<path d="M230 234 L230 250"
      fill="none"
      stroke="#64748b"
      stroke-width="2.5"
      marker-end="url(#arr)"/>
<path d="M570 234 L570 250"
      fill="none"
      stroke="#64748b"
      stroke-width="2.5"
      stroke-dasharray="6 4"
      marker-end="url(#arr)"/>

<!-- ================= 第 3 层：基础路 + 可选支路 ================= -->

<!-- 自动接入 -->

<rect width="300"
      height="74"
      x="80"
      y="250"
      fill="#fff7ed"
      stroke="#f97316"
      stroke-width="2"
      rx="14"/>

<text x="230"
      y="266"
      fill="#f9736"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="11"
      text-anchor="middle"
      style="font-weight:700">
自动接入 · 工具系统通路
</text>

<text x="230"
      y="290"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="monospace"
      font-size="12"
      text-anchor="middle"
      style="font-weight:700">
tool_use → dispatch
</text>

<text x="230"
      y="310"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="11"
      text-anchor="middle">
登记即得：校验 → 权限 → 执行，全自动
</text>



<!-- 可选支路 -->

<rect width="300"
      height="74"
      x="420"
      y="250"
      fill="#f0fdf4"
      stroke="#22c55e"
      stroke-width="2"
      rx="14"
      stroke-dasharray="6 4"/>

<text x="570"
      y="266"
      fill="#22c55e"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="11"
      text-anchor="middle"
      style="font-weight:700">
可选支路 · 以 REPL 为例
</text>

<text x="570"
      y="290"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="monospace"
      font-size="12"
      text-anchor="middle"
      style="font-weight:700">
/skills → 命令引擎
</text>

<text x="570"
      y="310"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="11"
      text-anchor="middle">
不经分发器 · builtins 直达
</text>

<!-- 汇聚到引擎 -->
<path d="M230 324 L230 348"
      fill="none"
      stroke="#64748b"
      stroke-width="2.5"
      marker-end="url(#arr)"/>
<path d="M570 324 L570 348"
      fill="none"
      stroke="#64748b"
      stroke-width="2.5"
      stroke-dasharray="6 4"
      marker-end="url(#arr)"/>

<!-- ================= 引擎 ================= -->

<rect width="640" height="56"
      x="80" y="348"
      fill="#eff6ff"
      stroke="#3b82f6"
      stroke-width="2"
      rx="14"/>

<text x="400" y="372"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="monospace"
      font-size="15"
      text-anchor="middle"
      style="font-weight:700">
run_action —— 同一个 SkillSearcher
</text>

<text x="400" y="392"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="12"
      text-anchor="middle">
入口可以无数个，底下的引擎永远只有一个
</text>

<!-- ================= 底部点题 ================= -->

<text x="400" y="416"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="14"
      text-anchor="middle"
      style="font-weight:700">
殊途同归：自动接入是基础，其余的路按需选，握的是同一台发动机
</text>

</svg>
