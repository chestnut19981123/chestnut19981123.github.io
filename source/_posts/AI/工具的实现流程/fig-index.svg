<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430"><defs><marker id="arr" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#64748b" d="M0,0 L8,4 L0,8 Z"/></marker></defs><rect width="800" height="430" fill="#fff"/><text x="400" y="32" fill="#1e293b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" text-anchor="middle" style="font-weight:700">TF-IDF 索引：五张表 + 一条公式</text><rect width="250" height="52" x="40" y="66" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="14"/><text x="165" y="86" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="15" text-anchor="middle" style="font-weight:700">doc_store</text><text x="165" y="106" fill="#64748b" dominant-baseline="middle" font-family="monospace" font-size="12" text-anchor="middle">doc_id → 原始文档</text><rect width="250" height="52" x="40" y="130" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="14"/><text x="165" y="150" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="15" text-anchor="middle" style="font-weight:700">token_counts</text><text x="165" y="170" fill="#64748b" dominant-baseline="middle" font-family="monospace" font-size="12" text-anchor="middle">doc_id → token 总数（长度归一用）</text><rect width="250" height="52" x="40" y="194" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="14"/><text x="165" y="214" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="15" text-anchor="middle" style="font-weight:700">inverted_index</text><text x="165" y="234" fill="#64748b" dominant-baseline="middle" font-family="monospace" font-size="12" text-anchor="middle">term → [(doc_id, 词频)] 倒排索引</text><rect width="250" height="52" x="40" y="258" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="14"/><text x="165" y="278" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="15" text-anchor="middle" style="font-weight:700">doc_freq</text><text x="165" y="298" fill="#64748b" dominant-baseline="middle" font-family="monospace" font-size="12" text-anchor="middle">term → 多少文档含它（稀有度）</text><rect width="250" height="52" x="40" y="322" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="14"/><text x="165" y="342" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="15" text-anchor="middle" style="font-weight:700">idf</text><text x="165" y="362" fill="#64748b" dominant-baseline="middle" font-family="monospace" font-size="12" text-anchor="middle">term → 预计算的逆文档频率</text><text x="165" y="396" fill="#64748b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" text-anchor="middle">搜索 = 查表相加，不扫全库</text><rect width="420" height="184" x="340" y="66" fill="#fff7ed" stroke="#f97316" stroke-width="2" rx="14"/><text x="550" y="94" fill="#1e293b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" text-anchor="middle" style="font-weight:700">打分公式</text><text x="550" y="126" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="17" text-anchor="middle" style="font-weight:700">score = doc.weight × Σ</text><text x="550" y="150" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="17" text-anchor="middle" style="font-weight:700">( tf/√total × idf² × field_boost )</text><text x="550" y="180" fill="#64748b" dominant-baseline="middle" font-family="monospace" font-size="13" text-anchor="middle">tf/√total —— 词频长度归一，防水文</text><text x="550" y="200" fill="#64748b" dominant-baseline="middle" font-family="monospace" font-size="13" text-anchor="middle">idf² —— 稀有词加权，烂大街词降权</text><text x="550" y="220" fill="#64748b" dominant-baseline="middle" font-family="monospace" font-size="13" text-anchor="middle">field_boost —— 字段命中权重</text><text x="550" y="242" fill="#64748b" dominant-baseline="middle" font-family="monospace" font-size="13" text-anchor="middle">平滑 IDF：idf = log((N+1)/(df+1)) + 1</text><rect width="420" height="138" x="340" y="262" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="14"/><text x="550" y="288" fill="#1e293b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" text-anchor="middle" style="font-weight:700">字段权重：名字命中 &gt; 正文命中</text><text x="470" y="316" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="14" text-anchor="middle" style="font-weight:700">name / title ×3.0</text><text x="630" y="316" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="14" text-anchor="middle" style="font-weight:700">tags ×2.5</text><text x="470" y="346" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="14" text-anchor="middle" style="font-weight:700">description ×2.0</text><text x="630" y="346" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="14" text-anchor="middle" style="font-weight:700">body ×1.0</text><text x="550" y="380" fill="#64748b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" text-anchor="middle">索引时烘进词频：name 里出现计 3 次，body 计 1 次</text></svg>