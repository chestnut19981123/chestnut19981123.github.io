<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
<rect width="800" height="460" fill="#fff"/>
<text x="400" y="32" fill="#1e293b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" text-anchor="middle" style="font-weight:700">流式:让 AI 从「寄快递」变成「打电话」</text>
<rect width="300" height="154" x="60" y="70" fill="#f8fafc" stroke="#334155" stroke-width="2.5" rx="16"/><text x="210" y="100" fill="#1e293b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" text-anchor="middle" style="font-weight:700">不流式:等快递</text>
<circle cx="210" cy="146" r="26" fill="#fff" stroke="#94a3b8" stroke-width="3"/><line x1="210" x2="210" y1="146" y2="132" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><line x1="210" x2="220" y1="146" y2="150" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><circle cx="210" cy="146" r="3.5" fill="#64748b"/>
<text x="210" y="213" fill="#64748b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" text-anchor="middle">等整段生成完,一次性收到</text>
<rect width="300" height="154" x="440" y="70" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5" rx="16"/><text x="590" y="100" fill="#1e293b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" text-anchor="middle" style="font-weight:700">流式:打电话</text>
<rect width="36" height="22" x="480" y="121" fill="#fff" stroke="#93c5fd" stroke-width="1.5" rx="11"/><text x="498" y="133" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="11" text-anchor="middle">你</text>
<rect width="62" height="22" x="480" y="149" fill="#fff" stroke="#93c5fd" stroke-width="1.5" rx="11"/><text x="511" y="161" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="11" text-anchor="middle">你好</text>
<rect width="150" height="22" x="480" y="177" fill="#fff" stroke="#93c5fd" stroke-width="1.5" rx="11"/><text x="499" y="189" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="11" text-anchor="start">你好!我是…</text>
<rect width="8" height="16" x="636" y="180" fill="#3b82f6" opacity="0.75" rx="2"/>
<text x="590" y="213" fill="#64748b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" text-anchor="middle">边想边说,说到哪听到哪</text>
<rect width="600" height="162" x="100" y="238" fill="#0f172a" rx="18"/>
<circle cx="132" cy="262" r="5.5" fill="#ef4444"/><circle cx="150" cy="262" r="5.5" fill="#f97316"/><circle cx="168" cy="262" r="5.5" fill="#22c55e"/>
<text x="192" y="263" fill="#94a3b8" dominant-baseline="middle" font-family="monospace" font-size="12" text-anchor="start">curl -N 实测 · SSE 原始流(OpenAI 格式)</text>
<text x="400" y="294" fill="#e2e8f0" dominant-baseline="middle" font-family="monospace" font-size="13" text-anchor="middle">data: {"choices":[{"delta":{"content":"你"}}]}</text>
<text x="400" y="317" fill="#e2e8f0" dominant-baseline="middle" font-family="monospace" font-size="13" text-anchor="middle">data: {"choices":[{"delta":{"content":"好"}}]}</text>
<text x="400" y="340" fill="#e2e8f0" dominant-baseline="middle" font-family="monospace" font-size="13" text-anchor="middle">data: {"choices":[{"delta":{},"finish_reason":"stop"}]}</text>
<text x="400" y="363" fill="#4ade80" dominant-baseline="middle" font-family="monospace" font-size="13" text-anchor="middle">data: [DONE]</text>
<text x="400" y="436" fill="#64748b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" text-anchor="middle">OpenAI 系:一行一行 data:;Anthropic 系:message_start → content_block_delta → message_stop —— 拼 content 全靠 delta</text>
</svg>
