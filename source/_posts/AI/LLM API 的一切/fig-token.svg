<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520"><defs><marker id="arr" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#64748b" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
<rect width="800" height="520" fill="#fff"/>
<text x="400" y="32" fill="#1e293b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" text-anchor="middle" style="font-weight:700">Token:把话切碎,按片计价</text>
<rect width="200" height="48" x="300" y="62" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5" rx="24"/><text x="400" y="87" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="13" text-anchor="middle" style="font-weight:700">你好,世界! Hello World</text>
<line x1="400" x2="400" y1="114" y2="146" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
<rect width="34" height="46" x="245" y="150" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="10"/><text x="262" y="175" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="15" text-anchor="middle" style="font-weight:700">你</text>
<rect width="34" height="46" x="289" y="150" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="10"/><text x="306" y="175" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="15" text-anchor="middle" style="font-weight:700">好</text>
<rect width="34" height="46" x="333" y="150" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="10"/><text x="350" y="175" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="15" text-anchor="middle" style="font-weight:700">世</text>
<rect width="34" height="46" x="377" y="150" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="10"/><text x="394" y="175" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="15" text-anchor="middle" style="font-weight:700">界</text>
<rect width="62" height="46" x="421" y="150" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="10"/><text x="452" y="175" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="15" text-anchor="middle" style="font-weight:700">Hello</text>
<rect width="62" height="46" x="493" y="150" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="10"/><text x="524" y="175" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="15" text-anchor="middle" style="font-weight:700">World</text>
<text x="400" y="224" fill="#64748b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" text-anchor="middle">切碎后的每个小片 = 1 个 token —— 各家的切法不同,别自己数,看响应里的 usage</text>
<text x="400" y="252" fill="#1e293b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" text-anchor="middle" style="font-weight:700">上下文窗口:一次请求最多能带多少片</text>
<rect width="580" height="52" x="110" y="268" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" rx="26"/>
<rect width="360" height="40" x="126" y="274" fill="#3b82f6" rx="20"/><text x="306" y="295" fill="#fff" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" text-anchor="middle">历史 + 本轮输入(每轮变长)</text>
<text x="588" y="295" fill="#64748b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" text-anchor="middle">剩余窗口</text>
<text x="400" y="344" fill="#64748b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" text-anchor="middle">塞满了?最早的内容被挤出去 —— 3.3 里有「续命三招」</text>
<text x="400" y="382" fill="#1e293b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" text-anchor="middle" style="font-weight:700">计费不对称:输出比输入贵</text>
<rect width="180" height="72" x="170" y="404" fill="#f8fafc" stroke="#334155" stroke-width="2.5" rx="16"/><text x="260" y="428" fill="#1e293b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" text-anchor="middle" style="font-weight:700">输入</text><text x="260" y="456" fill="#64748b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" text-anchor="middle">prompt 侧:便宜</text>
<circle cx="400" cy="440" r="21" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="400" y="446" fill="#64748b" dominant-baseline="middle" font-family="monospace" font-size="14" text-anchor="middle" style="font-weight:700">≈5x</text>
<rect width="180" height="72" x="450" y="404" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5" rx="16"/><text x="540" y="428" fill="#1e293b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" text-anchor="middle" style="font-weight:700">输出</text><text x="540" y="456" fill="#64748b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" text-anchor="middle">生成侧:贵(各家不一)</text>
</svg>
