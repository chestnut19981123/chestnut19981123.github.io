<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
<rect width="800" height="460" fill="#fff"/>
<text x="400" y="32" fill="#1e293b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" text-anchor="middle" style="font-weight:700">messages:一段对话的全部「剧本」</text>
<rect width="580" height="252" x="110" y="92" fill="none" stroke="#94a3b8" stroke-width="2" rx="20" stroke-dasharray="7 5"/>
<text x="400" y="82" fill="#64748b" dominant-baseline="middle" font-family="monospace" font-size="13" text-anchor="middle">messages[] —— 随每次请求整包发送</text>
<rect width="90" height="30" x="130" y="125" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="15"/><text x="175" y="141" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="12" text-anchor="middle" style="font-weight:700">system</text>
<rect width="424" height="44" x="248" y="118" fill="#fff" stroke="#e2e8f0" stroke-width="2" rx="12"/><text x="268" y="141" fill="#1e293b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" text-anchor="start">你是资深职场助手,回复不超过 200 字</text>
<rect width="90" height="30" x="130" y="183" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="15"/><text x="175" y="199" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="12" text-anchor="middle" style="font-weight:700">user</text>
<rect width="424" height="44" x="248" y="176" fill="#fff" stroke="#e2e8f0" stroke-width="2" rx="12"/><text x="268" y="199" fill="#1e293b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" text-anchor="start">帮我写一封请假邮件</text>
<rect width="90" height="30" x="130" y="241" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="15"/><text x="175" y="257" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="12" text-anchor="middle" style="font-weight:700">assistant</text>
<rect width="424" height="44" x="248" y="234" fill="#fff" stroke="#e2e8f0" stroke-width="2" rx="12"/><text x="268" y="257" fill="#1e293b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" text-anchor="start">好的。开头写申请理由,结尾落款日期</text>
<rect width="90" height="30" x="130" y="299" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="15"/><text x="175" y="315" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="12" text-anchor="middle" style="font-weight:700">user</text>
<rect width="424" height="44" x="248" y="292" fill="#fff" stroke="#e2e8f0" stroke-width="2" rx="12"/><text x="268" y="315" fill="#1e293b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" text-anchor="start">语气再轻松一点</text>
<text x="400" y="392" fill="#1e293b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" text-anchor="middle" style="font-weight:700">模型不记得你 —— 每轮都把整份剧本重新寄出</text>
<text x="400" y="422" fill="#64748b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" text-anchor="middle">assistant 消息必须原样回传;删掉某段历史 = 让它忘记那件事</text>
</svg>
