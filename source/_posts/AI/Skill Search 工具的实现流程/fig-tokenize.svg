<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430">

<defs>
  <marker id="arr"
          markerHeight="9"
          markerWidth="9"
          orient="auto-start-reverse"
          refX="8"
          refY="5"
          viewBox="0 0 10 10">
    <path fill="#64748b" d="M 0 0 L 10 5 L 0 10 z"/>
  </marker>
</defs>

<!-- 标题 -->
<text x="400" y="32"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="20" 
      text-anchor="middle"
      style="font-weight:600">
分词管线：两套引擎，各干各的
</text>

<!-- ================= 原始文本 ================= -->

<rect width="720" height="58"
      x="40" y="66"
      fill="#eff6ff"
      stroke="#3b82f6"
      stroke-width="2.5"
      rx="14"/>

<text x="400" y="90"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'CaskaydiaCove NF', 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="17"
      text-anchor="middle"
      style="font-weight:600">
浏览器 automation BrowserPlaywright 123 …
</text>

<text x="400" y="111"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="13"
      text-anchor="middle">
一行原始文本：中英混杂，还有驼峰和数字
</text>

<line x1="400" x2="400" y1="124" y2="152"
      stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

<!-- ================= 分片 ================= -->

<rect width="720" height="42"
      x="40" y="152"
      fill="#f8fafc"
      stroke="#334155"
      stroke-width="2.5"
      rx="14"/>

<text x="400" y="173"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'CaskaydiaCove NF', 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="16"
      text-anchor="middle"
      style="font-weight:600">
_segment_text：扫描全文，把连续同字符段归给对应处理器
</text>

<!-- 分叉线 -->
<line x1="180" x2="150" y1="194" y2="214"
      stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="400" x2="400" y1="194" y2="214"
      stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="620" x2="650" y1="194" y2="214"
      stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

<line x1="150" x2="400" y1="194" y2="194" stroke="#cbd5e1" stroke-width="2"/>
<line x1="400" x2="620" y1="194" y2="194" stroke="#cbd5e1" stroke-width="2"/>

<!-- ================= 三个处理器 ================= -->

<rect width="220" height="96"
      x="40" y="214"
      fill="#eff6ff"
      stroke="#3b82f6"
      stroke-width="2.5"
      rx="14"/>

<text x="150" y="238"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'CaskaydiaCove NF', 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="16"
      text-anchor="middle"
      style="font-weight:600">
LatinProcessor
</text>

<text x="150" y="260"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'CaskaydiaCove NF', 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="13"
      text-anchor="middle">
camelCase 拆分
</text>

<text x="150" y="278"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="13"
      text-anchor="middle">
小写折叠 · 停用词过滤
</text>

<text x="150" y="298"
      fill="#94a3b8"
      dominant-baseline="middle"
      font-family="'CaskaydiaCove NF', 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="12"
      text-anchor="middle">
priority 10 · 英文段
</text>

<rect width="220" height="96"
      x="290" y="214"
      fill="#f0fdf4"
      stroke="#22c55e"
      stroke-width="2.5"
      rx="14"/>

<text x="400" y="238"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'CaskaydiaCove NF', 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="16"
      text-anchor="middle"
      style="font-weight:600">
CJKProcessor
</text>

<text x="400" y="260"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'CaskaydiaCove NF', 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="13"
      text-anchor="middle">
bigram：「浏览」「览器」
</text>

<text x="400" y="278"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="13"
      text-anchor="middle">
有 jieba 就升级词级分词
</text>

<text x="400" y="298"
      fill="#94a3b8"
      dominant-baseline="middle"
      font-family="'CaskaydiaCove NF', 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="12"
      text-anchor="middle">
priority 20 · 中文段
</text>

<rect width="220" height="96"
      x="540" y="214"
      fill="#fef2f2"
      stroke="#ef4444"
      stroke-width="2.5"
      rx="14"/>

<text x="650" y="238"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'CaskaydiaCove NF', 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="16"
      text-anchor="middle"
      style="font-weight:600">
FallbackProcessor
</text>

<text x="650" y="260"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="13"
      text-anchor="middle">
逐字符保留，不丢数据
</text>

<text x="650" y="278"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="13"
      text-anchor="middle">
西里尔 / 泰文 / 阿拉伯…
</text>

<text x="650" y="298"
      fill="#94a3b8"
      dominant-baseline="middle"
      font-family="'CaskaydiaCove NF', 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="12"
      text-anchor="middle">
priority 9999 · 兜底
</text>

<!-- 汇聚线 -->
<line x1="150" x2="150" y1="310" y2="334"
      stroke="#cbd5e1" stroke-width="2"/>
<line x1="400" x2="400" y1="310" y2="334"
      stroke="#cbd5e1" stroke-width="2"/>
<line x1="650" x2="650" y1="310" y2="334"
      stroke="#cbd5e1" stroke-width="2"/>

<line x1="150" x2="650" y1="334" y2="334" stroke="#cbd5e1" stroke-width="2"/>

<line x1="400" x2="400" y1="334" y2="358"
      stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

<!-- ================= 过滤 + 去重 ================= -->

<rect width="220" height="52"
      x="40" y="358"
      fill="#f8fafc"
      stroke="#334155"
      stroke-width="2.5"
      rx="14"/>

<text x="150" y="384"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'CaskaydiaCove NF', 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="15"
      text-anchor="middle"
      style="font-weight:600">
_normalize 长度过滤
</text>

<line x1="260" x2="310" y1="384" y2="384"
      stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

<rect width="220" height="52"
      x="310" y="358"
      fill="#f8fafc"
      stroke="#334155"
      stroke-width="2.5"
      rx="14"/>

<text x="420" y="384"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="15"
      text-anchor="middle"
      style="font-weight:600">
去重保序
</text>

<line x1="530" x2="580" y1="384" y2="384"
      stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

<rect width="220" height="52"
      x="580" y="358"
      fill="#eff6ff"
      stroke="#3b82f6"
      stroke-width="2.5"
      rx="14"/>

<text x="690" y="378"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'CaskaydiaCove NF', 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="15"
      text-anchor="middle"
      style="font-weight:600">
tokens 列表
</text>

<text x="690" y="396"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="12"
      text-anchor="middle">
交给 TF-IDF 索引
</text>


<defs><style>@font-face{font-family:'CaskaydiaCove NF';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;}</style></defs>
</svg>
