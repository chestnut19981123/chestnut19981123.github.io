<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430">

<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
  </marker>
</defs>

<rect width="800" height="430" fill="#ffffff"/>
<!-- 标题 -->
<text x="400" y="30"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="22" 
      text-anchor="middle"
      style="font-weight:700">
斜杠命令：一条手工铺设，一条自动化生成
</text>

<!-- 分隔线 -->
<line x1="400" x2="400" y1="60" y2="320"
      stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>

<!-- ================= 左侧：手工 /skills ================= -->

<text x="200" y="58"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="16"
      text-anchor="middle"
      style="font-weight:700">
手工路径：/skills
</text>

<rect width="320" height="54"
      x="40" y="74"
      fill="#eff6ff"
      stroke="#3b82f6"
      stroke-width="2"
      rx="14"/>

<text x="200" y="95"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="monospace"
      font-size="15"
      text-anchor="middle"
      style="font-weight:700">
/skills search 浏览器自动化
</text>

<text x="200" y="116"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="12"
      text-anchor="middle">
用户敲的
</text>

<line x1="200" x2="200" y1="128" y2="152"
      stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

<rect width="320" height="54"
      x="40" y="152"
      fill="#f8fafc"
      stroke="#334155"
      stroke-width="2"
      rx="14"/>

<text x="200" y="173"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="monospace"
      font-size="15"
      text-anchor="middle"
      style="font-weight:700">
builtins.py 手写定义
</text>

<text x="200" y="194"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="monospace"
      font-size="12"
      text-anchor="middle">
LocalCommand + set_call(skills_command_call)
</text>

<line x1="200" x2="200" y1="206" y2="230"
      stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

<rect width="320" height="76"
      x="40" y="230"
      fill="#fff7ed"
      stroke="#f97316"
      stroke-width="2"
      rx="14"/>

<text x="200" y="252"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="monospace"
      font-size="15"
      text-anchor="middle"
      style="font-weight:700">
skills_command_call 子命令分发
</text>

<text x="200" y="274"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="monospace"
      font-size="12"
      text-anchor="middle">
search / inspect / rebuild / stats
</text>

<text x="200" y="294"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="11"
      text-anchor="middle">
无参数时列出全部 skill
</text>

<!-- ================= 右侧：自动 /SkillSearch ================= -->

<text x="600" y="58"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="16"
      text-anchor="middle"
      style="font-weight:700">
自动路径：/SkillSearch
</text>

<rect width="320" height="54"
      x="440" y="74"
      fill="#eff6ff"
      stroke="#3b82f6"
      stroke-width="2"
      rx="14"/>

<text x="600" y="95"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="monospace"
      font-size="15"
      text-anchor="middle"
      style="font-weight:700">
/SkillSearch --action search --query …
</text>

<text x="600" y="116"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="12"
      text-anchor="middle">
用户敲的（或 tab 补全出来的）
</text>

<line x1="600" x2="600" y1="128" y2="152"
      stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

<rect width="320" height="54"
      x="440" y="152"
      fill="#f8fafc"
      stroke="#334155"
      stroke-width="2"
      rx="14"/>

<text x="600" y="173"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="15"
      text-anchor="middle"
      style="font-weight:700">
启动时自动注册
</text>

<text x="600" y="194"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="12"
      text-anchor="middle">
扫描注册表：每个非核心工具一个命令
</text>

<line x1="600" x2="600" y1="206" y2="230"
      stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

<rect width="320" height="76"
      x="440" y="230"
      fill="#f0fdf4"
      stroke="#22c55e"
      stroke-width="2"
      rx="14"/>

<text x="600" y="252"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="monospace"
      font-size="15"
      text-anchor="middle"
      style="font-weight:700">
DynamicToolCommand 适配器
</text>

<text x="600" y="274"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="monospace"
      font-size="12"
      text-anchor="middle">
schema → argparse 解析参数
</text>

<text x="600" y="294"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="11"
      text-anchor="middle">
冲突时让路，不覆盖已有命令
</text>

<!-- ================= 汇聚 ================= -->

<path d="M200 306 L200 330 L360 330 L360 346"
      fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M600 306 L600 330 L440 330 L440 346"
      fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

<rect width="420" height="64"
      x="190" y="346"
      fill="#eff6ff"
      stroke="#3b82f6"
      stroke-width="2"
      rx="14"/>

<text x="400" y="370"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="monospace"
      font-size="15"
      text-anchor="middle"
      style="font-weight:700">
命令引擎 → ToolCall → registry.dispatch
</text>

<text x="400" y="393"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC','Microsoft YaHei',sans-serif"
      font-size="13"
      text-anchor="middle">
两台方向盘，同一台发动机：同一个 SkillSearcher
</text>


</svg>
