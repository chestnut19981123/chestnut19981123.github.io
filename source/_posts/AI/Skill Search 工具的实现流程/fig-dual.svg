<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430">

<defs>
  <marker id="arr"
          markerHeight="9"
          markerWidth="9"
          orient="auto-start-reverse"
          refX="8"
          refY="5"
          viewBox="0 0 10 10">
    <path fill="#64748b" d="M 0 0 L 10 5 L 0 10 z"/>
  </marker>
</defs>

<!-- 标题 -->
<text x="400" y="30"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="20" 
      text-anchor="middle"
      style="font-weight:600">
斜杠命令：一条手工铺设，一条自动化生成
</text>

<!-- 分隔线 -->
<line x1="400" x2="400" y1="60" y2="320"
      stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>

<!-- ================= 左侧：手工 /skills ================= -->

<text x="200" y="58"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="16"
      text-anchor="middle"
      style="font-weight:600">
手工路径：/skills
</text>

<rect width="320" height="54"
      x="40" y="74"
      fill="#eff6ff"
      stroke="#3b82f6"
      stroke-width="2.5"
      rx="12"/>

<text x="200" y="95"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'CaskaydiaCove NF', 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
