      stroke="#3b82f6"
      stroke-width="2.5"
      rx="12"/>

<text x="600" y="95"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'CaskaydiaCove NF', 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="15"
      text-anchor="middle"
      style="font-weight:600">
/SkillSearch --action search --query …
</text>

<text x="600" y="116"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="12"
      text-anchor="middle">
用户敲的（或 tab 补全出来的）
</text>

<line x1="600" x2="600" y1="128" y2="152"
      stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

<rect width="320" height="54"
      x="440" y="152"
      fill="#f8fafc"
      stroke="#334155"
      stroke-width="2.5"
      rx="12"/>

<text x="600" y="173"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="15"
      text-anchor="middle"
      style="font-weight:600">
启动时自动注册
</text>

<text x="600" y="194"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="12"
      text-anchor="middle">
扫描注册表：每个非核心工具一个命令
</text>

<line x1="600" x2="600" y1="206" y2="230"
      stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

<rect width="320" height="76"
      x="440" y="230"
      fill="#f0fdf4"
      stroke="#22c55e"
      stroke-width="2.5"
      rx="12"/>

<text x="600" y="252"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'CaskaydiaCove NF', 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="15"
      text-anchor="middle"
      style="font-weight:600">
DynamicToolCommand 适配器
</text>

<text x="600" y="274"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'CaskaydiaCove NF', 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="12"
      text-anchor="middle">
schema → argparse 解析参数
</text>

<text x="600" y="294"
      fill="#94a3b8"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="11"
