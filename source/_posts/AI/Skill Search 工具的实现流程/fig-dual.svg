      fill="#fff7ed"
      stroke="#f97316"
      stroke-width="2.5"
      rx="12"/>

<text x="200" y="252"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'CaskaydiaCove NF', 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
