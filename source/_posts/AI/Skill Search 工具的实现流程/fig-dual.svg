冲突时让路，不覆盖已有命令
</text>

<!-- ================= 汇聚 ================= -->

<path d="M200 306 L200 330 L360 330 L360 346"
      fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M600 306 L600 330 L440 330 L440 346"
      fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

<rect width="420" height="64"
      x="190" y="346"
      fill="#eff6ff"
      stroke="#3b82f6"
      stroke-width="2.5"
      rx="14"/>

<text x="400" y="370"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'CaskaydiaCove NF', 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="15"
      text-anchor="middle"
      style="font-weight:600">
命令引擎 → ToolCall → registry.dispatch
</text>

<text x="400" y="393"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="13"
      text-anchor="middle">
两台方向盘，同一台发动机：同一个 SkillSearcher
</text>


<defs><style>@font-face{font-family:'CaskaydiaCove NF';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;}</style></defs>
</svg>
