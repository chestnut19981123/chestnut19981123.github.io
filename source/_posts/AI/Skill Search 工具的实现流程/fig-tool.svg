<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430">

<defs>
  <marker id="arr"
          markerHeight="9"
          markerWidth="9"
          orient="auto-start-reverse"
          refX="8"
          refY="5"
          viewBox="0 0 10 10">
    <path fill="#64748b" d="M 0 0 L 10 5 L 0 10 z"/>
  </marker>
</defs>

<!-- 标题 -->
<text x="400" y="32"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="20" 
      text-anchor="middle"
      style="font-weight:600">
一个 Tool = 声明 + 执行 + 标注
</text>

<!-- ================= Tool 容器 ================= -->

<rect width="520" height="336"
      x="140" y="70"
      fill="#f8fafc"
      stroke="#334155"
      stroke-width="2.5"
      rx="18"/>

<text x="400" y="99"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="17"
      text-anchor="middle"
      style="font-weight:600">
Tool（dataclass，一个对象装三个灵魂）
</text>

<!-- ================= 声明 ================= -->

<rect width="440" height="72"
      x="180" y="118"
      fill="#eff6ff"
      stroke="#3b82f6"
      stroke-width="2.5"
      rx="12"/>

<text x="400" y="142"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'CaskaydiaCove NF', 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="16"
      text-anchor="middle"
      style="font-weight:600">
声明：input_schema（JSON Schema）
</text>

<text x="400" y="164"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="13"
      text-anchor="middle">
序列化后发给模型，当「牌面」
</text>

<text x="400" y="180"
      fill="#94a3b8"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="12"
      text-anchor="middle">
模型不知道参数长什么样，就没法正确点菜
</text>

<!-- ================= 执行 ================= -->

<rect width="440" height="72"
      x="180" y="206"
      fill="#fff7ed"
      stroke="#f97316"
      stroke-width="2.5"
      rx="12"/>

<text x="400" y="230"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'CaskaydiaCove NF', 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="16"
      text-anchor="middle"
      style="font-weight:600">
执行：call(input, context) → ToolResult
</text>

<text x="400" y="252"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="13"
      text-anchor="middle">
模型点菜后，真正掌勺的函数
</text>

<text x="400" y="268"
      fill="#94a3b8"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="12"
      text-anchor="middle">
读文件、跑命令、查索引，全在这个回调里
</text>

<!-- ================= 标注 ================= -->

<rect width="440" height="72"
      x="180" y="294"
      fill="#f0fdf4"
      stroke="#22c55e"
      stroke-width="2.5"
      rx="12"/>

<text x="400" y="318"
      fill="#1e293b"
      dominant-baseline="middle"
      font-family="'CaskaydiaCove NF', 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="16"
      text-anchor="middle"
      style="font-weight:600">
标注：is_read_only · is_concurrency_safe …
</text>

<text x="400" y="340"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'CaskaydiaCove NF', 'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="13"
      text-anchor="middle">
check_permissions：跑之前先过我这关
</text>

<text x="400" y="356"
      fill="#94a3b8"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="12"
      text-anchor="middle">
宿主靠标注决定：能不能并发、要不要小心伺候
</text>

<!-- ================= 右侧标签 ================= -->

<line x1="620" x2="662" y1="154" y2="166"
      stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

<text x="690" y="166"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="13"
      text-anchor="middle">
给模型看
</text>

<line x1="620" x2="662" y1="242" y2="254"
      stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

<text x="690" y="254"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="13"
      text-anchor="middle">
给机器跑
</text>

<line x1="620" x2="662" y1="330" y2="342"
      stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

<text x="690" y="342"
      fill="#64748b"
      dominant-baseline="middle"
      font-family="'PingFang SC', 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif"
      font-size="13"
      text-anchor="middle">
给系统读
</text>


<defs><style>@font-face{font-family:'CaskaydiaCove NF';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;}</style></defs>
</svg>
