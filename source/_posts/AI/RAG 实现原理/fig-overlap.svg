<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
  <title id="title">相邻文本块通过重叠保留边界上下文</title>
  <desc id="desc">一段住宿规则被切成两个相邻文本块，“其他城市每晚”同时出现在块 A 的末尾与块 B 的开头，明确展示切块重叠。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family:'PingFang SC','Microsoft YaHei',sans-serif; }
      .head { fill:#0f172a; font-size:23px; font-weight:700; text-anchor:middle; }
      .label { fill:#0f172a; font-size:16px; font-weight:700; }
      .body { fill:#334155; font-size:17px; }
      .note { fill:#64748b; font-size:14px; }
    </style>
  </defs>
  <rect width="800" height="430" fill="#fff"/>
  <text class="head" x="400" y="43">相邻块共享一段文字，边界就不容易切断语义</text>

  <rect x="56" y="70" width="688" height="68" rx="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="label" x="80" y="98">原文</text>
  <text class="body" x="80" y="124">一线城市每晚 800 元；其他城市每晚 500 元。</text>

  <path d="M400 145V174" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="56" y="183" width="330" height="126" rx="17" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="414" y="183" width="330" height="126" rx="17" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="label" x="80" y="214">文本块 A</text>
  <text class="body" x="80" y="251">一线城市每晚 800 元；</text>
  <rect x="76" y="265" width="275" height="30" rx="8" fill="#FFF2DA"/>
  <text x="88" y="286" fill="#9A6417" font-size="16" font-weight="700">其他城市每晚</text>

  <text class="label" x="438" y="214">文本块 B</text>
  <rect x="434" y="226" width="275" height="30" rx="8" fill="#FFF2DA"/>
  <text x="446" y="247" fill="#9A6417" font-size="16" font-weight="700">其他城市每晚</text>
  <text class="body" x="438" y="280">500 元；超出标准的</text>
  <text class="body" x="438" y="302">差价不予报销。</text>

  <path d="M214 322V344H584V322" fill="none" stroke="#E5B45F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="247" y="344" width="306" height="38" rx="19" fill="#FFF8EA" stroke="#F1D8AA"/>
  <text x="400" y="369" text-anchor="middle" fill="#8A5B18" font-size="15" font-weight="700">两块重复保存的重叠片段：其他城市每晚</text>
  <text class="note" x="400" y="411" text-anchor="middle">重叠让检索结果保留边界上下文；重叠过大则会增加重复内容</text>
</svg>
