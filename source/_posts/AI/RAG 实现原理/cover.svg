<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">RAG：从资料中检索证据，再生成回答</title>
  <desc id="desc">简洁的横向主视觉：一份制度文档经过语义检索，成为带有出处的答案；底部以一条宽阔的索引结构承托画面。标题安全区保持留白。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF3F8"/>
    </linearGradient>
    <linearGradient id="search" x1="500" y1="170" x2="790" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAF3FF"/>
      <stop offset="1" stop-color="#DCEBFA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#334155" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="170" cy="220" r="190" fill="#E7F0FC" opacity=".7"/>
  <circle cx="1100" cy="230" r="190" fill="#E8F4EF" opacity=".72"/>

  <!-- A single document becomes grounded evidence. -->
  <g filter="url(#shadow)">
    <rect x="135" y="158" width="270" height="238" rx="24" fill="#fff" stroke="#D5E0EC" stroke-width="2"/>
  </g>
  <path d="M342 158h63v63" fill="#F1F6FB" stroke="#D5E0EC" stroke-width="2"/>
  <path d="M342 158v63h63" fill="none" stroke="#D5E0EC" stroke-width="2"/>
  <rect x="175" y="210" width="112" height="12" rx="6" fill="#8DBCF0"/>
  <rect x="175" y="249" width="185" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="175" y="276" width="152" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="164" y="309" width="211" height="45" rx="12" fill="#FFF2DA"/>
  <rect x="181" y="326" width="151" height="10" rx="5" fill="#E5B45F"/>
  <rect x="175" y="369" width="166" height="9" rx="4.5" fill="#CBD5E1"/>

  <path d="M429 278H503" fill="none" stroke="#A7B6C7" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="520" y="150" width="260" height="250" rx="34" fill="url(#search)" stroke="#C9DDF1" stroke-width="2"/>
  </g>
  <circle cx="650" cy="257" r="66" fill="#fff" stroke="#91B8E6" stroke-width="8"/>
  <path d="M699 306l48 48" stroke="#91B8E6" stroke-width="18" stroke-linecap="round"/>
  <circle cx="650" cy="257" r="28" fill="#3B82F6"/>
  <path d="M634 258l11 11 23-25" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M802 278H875" fill="none" stroke="#9CCDBB" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="895" y="174" width="250" height="205" rx="24" fill="#fff" stroke="#D5E4DE" stroke-width="2"/>
  </g>
  <rect x="931" y="211" width="72" height="12" rx="6" fill="#78BFA6"/>
  <rect x="931" y="250" width="178" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="931" y="278" width="150" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="919" y="310" width="202" height="40" rx="11" fill="#EAF6F1"/>
  <rect x="937" y="325" width="158" height="10" rx="5" fill="#78BFA6"/>

  <!-- One broad index foundation balances the full homepage cover without tiny ornaments. -->
  <rect x="178" y="520" width="924" height="122" rx="28" fill="#fff" stroke="#D7E1EB" stroke-width="2"/>
  <path d="M486 545V617M794 545V617" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="216" y="551" width="232" height="40" rx="12" fill="#F8FAFC"/>
  <rect x="244" y="565" width="174" height="12" rx="6" fill="#9AAABD"/>
  <rect x="524" y="551" width="232" height="40" rx="12" fill="#EFF6FF"/>
  <g fill="#9FC5F3"><rect x="548" y="562" width="18" height="18" rx="5"/><rect x="576" y="562" width="18" height="18" rx="5"/><rect x="604" y="562" width="18" height="18" rx="5"/><rect x="632" y="562" width="18" height="18" rx="5"/><rect x="660" y="562" width="18" height="18" rx="5"/><rect x="688" y="562" width="18" height="18" rx="5"/><rect x="716" y="562" width="18" height="18" rx="5"/></g>
  <rect x="832" y="551" width="232" height="40" rx="12" fill="#F0F8F4"/>
  <rect x="862" y="565" width="172" height="12" rx="6" fill="#84BFA9"/>
  <rect x="216" y="605" width="848" height="8" rx="4" fill="#E8EDF2"/>
</svg>
