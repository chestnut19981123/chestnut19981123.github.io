<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">从语义空间召回相关文本块</title>
  <desc id="desc">问题向量在示意空间中靠近三个候选文档块。右侧按相似度列出候选，再取回对应原文；相似度排序不等于答案正确概率。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      text { font-family:'PingFang SC','Microsoft YaHei',sans-serif; }
      .head { fill:#0f172a; font-size:23px; font-weight:700; text-anchor:middle; }
      .txt { fill:#334155; font-size:13px; }
      .small { fill:#64748b; font-size:12px; }
    </style>
  </defs>
  <rect width="800" height="500" fill="#fff"/>
  <text class="head" x="400" y="42">语义接近的块会排在前面，原文再被取回</text>
  <rect x="30" y="72" width="468" height="350" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="54" y="101" fill="#0f172a" font-size="15" font-weight="700">向量空间（二维仅作示意）</text>
  <g fill="none" stroke="#94a3b8" stroke-width="1.5" opacity=".32"><circle cx="270" cy="258" r="64"/><circle cx="270" cy="258" r="112"/><circle cx="270" cy="258" r="160"/></g>
  <g fill="#cbd5e1"><circle cx="115" cy="166" r="7"/><circle cx="411" cy="151" r="7"/><circle cx="104" cy="330" r="7"/><circle cx="430" cy="343" r="7"/><circle cx="179" cy="131" r="7"/><circle cx="388" cy="292" r="7"/><circle cx="167" cy="377" r="7"/></g>
  <g fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 4" opacity=".62"><path d="M270 258L220 207"/><path d="M270 258L331 196"/><path d="M270 258L342 303"/></g>
  <g fill="#3b82f6" stroke="#fff" stroke-width="2"><circle cx="220" cy="207" r="10"/><circle cx="331" cy="196" r="10"/><circle cx="342" cy="303" r="10"/></g>
  <circle cx="270" cy="258" r="14" fill="#f59e0b" stroke="#fff" stroke-width="3"/>
  <text x="270" y="286" text-anchor="middle" fill="#92400e" font-size="13" font-weight="700">问题向量</text>
  <text class="small" x="205" y="185">住宿条款</text><text class="small" x="350" y="183">城市标准</text><text class="small" x="355" y="324">超标规则</text>
  <rect x="518" y="72" width="252" height="350" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="644" y="101" text-anchor="middle" fill="#0f172a" font-size="15" font-weight="700">排序后取回原文</text>
  <g>
    <rect x="538" y="121" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/>
    <circle cx="560" cy="145" r="12" fill="#3b82f6"/><text x="560" y="150" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">1</text>
    <text x="582" y="145" fill="#0f172a" font-size="13" font-weight="700">住宿标准</text><text class="txt" x="552" y="173">一线城市每晚 800 元…</text>
    <rect x="538" y="204" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/>
    <circle cx="560" cy="228" r="12" fill="#3b82f6"/><text x="560" y="233" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">2</text>
    <text x="582" y="228" fill="#0f172a" font-size="13" font-weight="700">城市适用范围</text><text class="txt" x="552" y="256">北京、上海、广州、深圳…</text>
    <rect x="538" y="287" width="212" height="72" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/>
    <circle cx="560" cy="311" r="12" fill="#3b82f6"/><text x="560" y="316" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">3</text>
    <text x="582" y="311" fill="#0f172a" font-size="13" font-weight="700">超标处理</text><text class="txt" x="552" y="339">差价不予报销…</text>
  </g>
  <path d="M497 258H514" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="644" y="392" text-anchor="middle" class="small">相似度负责排序，不是正确率</text>
  <text x="400" y="466" text-anchor="middle" fill="#64748b" font-size="14">候选排名只决定先看谁；最终回答仍要核对原文、条件与出处</text>
</svg>
