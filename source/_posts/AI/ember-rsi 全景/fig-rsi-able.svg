<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">RSI-able：一个目标要满足什么</title>
  <desc id="desc">可标识、可提议、可测量、可选择四个条件，分别对应 Application、Proposer、Evaluator、Selector 四个可替换契约；条件齐了，Agent Bundle、Inference、Kernel 三种目标都能接进同一个 RSI Core。</desc>
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      text { font-family:'PingFang SC','Microsoft YaHei',sans-serif; }
      .head { fill:#0f172a; font-size:23px; font-weight:700; text-anchor:middle; }
      .sub { fill:#64748b; font-size:14px; text-anchor:middle; }
      .num { fill:#fff; font-size:10px; font-weight:700; text-anchor:middle; }
      .ct { fill:#0f172a; font-size:14px; font-weight:700; }
      .cd { fill:#64748b; font-size:10.5px; }
      .role { font-size:10.5px; font-weight:700; }
      .tt { font-size:13px; font-weight:700; }
      .mono { font-family:'SFMono-Regular','Consolas',monospace; font-size:8.5px; fill:#94a3b8; }
      .detail { fill:#475569; font-size:11px; }
      .fine { fill:#94a3b8; font-size:10px; }
      .note { fill:#64748b; font-size:12px; text-anchor:middle; }
    </style>
  </defs>
  <rect width="800" height="500" fill="#fff"/>

  <text class="head" x="400" y="42">RSI-able：一个目标要满足什么</text>
  <text class="sub" x="400" y="72">四件事齐了，目标就能接进同一套循环</text>

  <!-- condition 1 -->
  <rect x="30" y="100" width="170" height="112" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="50" cy="120" r="9" fill="#64748b"/>
  <text class="num" x="50" y="123.5">1</text>
  <text class="ct" x="68" y="126" fill="#334155">可标识</text>
  <text class="cd" x="46" y="150">基线 H0、候选 H1</text>
  <text class="cd" x="46" y="168">每一版都有身份</text>
  <text class="role" x="46" y="197" fill="#475569">Application 管基线</text>

  <!-- condition 2 -->
  <rect x="220" y="100" width="170" height="112" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <circle cx="240" cy="120" r="9" fill="#3b82f6"/>
  <text class="num" x="240" y="123.5">2</text>
  <text class="ct" x="258" y="126" fill="#1d4ed8">可提议</text>
  <text class="cd" x="236" y="150">从当前版本</text>
  <text class="cd" x="236" y="168">变出下一版</text>
  <text class="role" x="236" y="197" fill="#1d4ed8">Proposer 出候选</text>

  <!-- condition 3 -->
  <rect x="410" y="100" width="170" height="112" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <circle cx="430" cy="120" r="9" fill="#10b981"/>
  <text class="num" x="430" y="123.5">3</text>
  <text class="ct" x="448" y="126" fill="#047857">可测量</text>
  <text class="cd" x="426" y="150">任务 + 指标</text>
  <text class="cd" x="426" y="168">两版能比较</text>
  <text class="role" x="426" y="197" fill="#047857">Evaluator 给分数</text>

  <!-- condition 4 -->
  <rect x="600" y="100" width="170" height="112" rx="14" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <circle cx="620" cy="120" r="9" fill="#8b5cf6"/>
  <text class="num" x="620" y="123.5">4</text>
  <text class="ct" x="638" y="126" fill="#6d28d9">可选择</text>
  <text class="cd" x="616" y="150">规则决定</text>
  <text class="cd" x="616" y="168">留下哪一版</text>
  <text class="role" x="616" y="197" fill="#6d28d9">Selector 做决定</text>

  <!-- bracket -->
  <path d="M115 212V236M305 212V236M495 212V236M685 212V236" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M115 236H685" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M400 236V256" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- core -->
  <rect x="250" y="260" width="300" height="48" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="ct" x="400" y="282" text-anchor="middle" fill="#0f172a" style="font-size:15px">RSI Core</text>
  <text class="cd" x="400" y="299" text-anchor="middle">提案 → 提交 → 评测 → 选择</text>

  <!-- fan out -->
  <path d="M400 308C400 330 150 330 150 350" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>
  <path d="M400 308V350" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>
  <path d="M400 308C400 330 650 330 650 350" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- target: agent bundle -->
  <rect x="40" y="354" width="220" height="94" rx="14" fill="#fff" stroke="#bfdbfe" stroke-width="1.5"/>
  <circle cx="66" cy="380" r="12" fill="#dbeafe"/>
  <circle cx="66" cy="380" r="6" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="63.8" cy="379" r="1" fill="#3b82f6"/>
  <circle cx="68.2" cy="379" r="1" fill="#3b82f6"/>
  <path d="M63.5 383q2.5 1.8 5 0" fill="none" stroke="#3b82f6" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M66 372v-3" stroke="#60a5fa" stroke-width="1.4" stroke-linecap="round"/>
  <text class="tt" x="84" y="380" fill="#1d4ed8">Agent Bundle</text>
  <text class="mono" x="84" y="395">application.agentbundle</text>
  <text class="detail" x="54" y="420">提示词 · Skill · 代码</text>
  <text class="fine" x="54" y="438">Bundle 文件快照</text>

  <!-- target: inference -->
  <rect x="290" y="354" width="220" height="94" rx="14" fill="#fff" stroke="#a7f3d0" stroke-width="1.5"/>
  <circle cx="316" cy="380" r="12" fill="#d1fae5"/>
  <path d="M308 384a8 8 0 0 1 16 0" fill="none" stroke="#10b981" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M316 384l4-5" stroke="#10b981" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="316" cy="384" r="1.4" fill="#10b981"/>
  <text class="tt" x="334" y="380" fill="#047857">Inference</text>
  <text class="mono" x="334" y="395">application.inference</text>
  <text class="detail" x="304" y="420">参数 · 服务配置</text>
  <text class="fine" x="304" y="438">参数配置快照</text>

  <!-- target: kernel -->
  <rect x="540" y="354" width="220" height="94" rx="14" fill="#fff" stroke="#ddd6fe" stroke-width="1.5"/>
  <circle cx="566" cy="380" r="12" fill="#ede9fe"/>
  <rect x="559" y="373" width="14" height="14" rx="3" fill="none" stroke="#8b5cf6" stroke-width="1.6"/>
  <path d="M562 370v-2.5M566 370v-2.5M570 370v-2.5M562 390v-2.5M566 390v-2.5M570 390v-2.5M556 376h-2.5M556 380h-2.5M556 384h-2.5M579 376h-2.5M579 380h-2.5M579 384h-2.5" stroke="#8b5cf6" stroke-width="1.2" stroke-linecap="round"/>
  <text class="tt" x="584" y="380" fill="#6d28d9">Kernel</text>
  <text class="mono" x="584" y="395">application.kernel</text>
  <text class="detail" x="554" y="420">Triton 算子源码</text>
  <text class="fine" x="554" y="438">算子源码快照</text>

  <text class="note" x="400" y="482">四个条件齐了，目标的大小就不重要了。</text>
</svg>
