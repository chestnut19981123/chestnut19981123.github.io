<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <rect x="40" y="50" width="340" height="350" rx="18" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5"/>
  <text x="210" y="86" fill="#ef4444" dominant-baseline="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" text-anchor="middle" style="font-weight:600">没有工具：全靠嘴</text>

  <circle cx="180" cy="165" r="45" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
  <circle cx="165" cy="157" r="6" fill="#1e293b"/>
  <circle cx="195" cy="157" r="6" fill="#1e293b"/>
  <path d="M 165 180 Q 180 172 195 180" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 218 140 c 6 -11 13 -11 13 0 c 0 5 -13 10 -13 10 z" fill="#38bdf8"/>
  <path d="M 234 158 c 5 -9 11 -9 11 0 c 0 4 -11 8 -11 8 z" fill="#38bdf8"/>

  <rect x="80" y="235" width="260" height="105" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="210" y="264" fill="#1e293b" dominant-baseline="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle" style="font-weight:600">9.11 和 9.9 哪个大？</text>
  <text x="210" y="294" fill="#ef4444" dominant-baseline="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" text-anchor="middle" style="font-weight:600">那当然是 9.11 大啊！</text>
  <text x="210" y="320" fill="#64748b" dominant-baseline="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle">（一本正经地胡说八道）</text>

  <rect x="420" y="50" width="340" height="350" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5"/>
  <text x="590" y="86" fill="#15803d" dominant-baseline="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" text-anchor="middle" style="font-weight:600">有 Tool Calling：调工具算</text>

  <circle cx="580" cy="165" r="45" fill="#ffffff" stroke="#22c55e" stroke-width="2.5"/>
  <circle cx="565" cy="157" r="6" fill="#1e293b"/>
  <circle cx="595" cy="157" r="6" fill="#1e293b"/>
  <path d="M 565 180 Q 580 190 595 180" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <rect x="626" y="138" width="52" height="44" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="2.5"/>
  <rect x="632" y="145" width="40" height="13" rx="3" fill="#f0fdf4" stroke="#4ade80" stroke-width="1"/>
  <circle cx="642" cy="171" r="3" fill="#22c55e"/>
  <circle cx="654" cy="171" r="3" fill="#22c55e"/>
  <circle cx="666" cy="171" r="3" fill="#22c55e"/>

  <rect x="460" y="235" width="260" height="105" rx="16" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="590" y="264" fill="#1e293b" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang SC', 'Microsoft YaHei', monospace" font-size="15" text-anchor="middle">compare("9.11", "9.9")</text>
  <text x="590" y="294" fill="#22c55e" dominant-baseline="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" text-anchor="middle" style="font-weight:600">→ 9.9 更大 ✓</text>
  <text x="590" y="320" fill="#64748b" dominant-baseline="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle">（这是算出来的，不是猜的）</text>

  <text x="400" y="435" fill="#64748b" dominant-baseline="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="middle">同一个问题：一个靠嘴编，一个靠工具算</text>
</svg>
