<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">四种多 Agent 编排拓扑</title>
  <desc id="desc">主管-工人适合可并行的信息收集，流水线适合有明确阶段的长流程，生成-验证适合需要挑错的产出，群聊辩论理论上最灵活但今天最难控制。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      text { font-family:'PingFang SC','Microsoft YaHei',sans-serif; }
      .head { fill:#0f172a; font-size:23px; font-weight:700; text-anchor:middle; }
      .sub { fill:#64748b; font-size:15px; text-anchor:middle; }
      .ct { fill:#0f172a; font-size:16px; font-weight:700; }
      .cn { fill:#64748b; font-size:12.5px; }
      .n { fill:#0f172a; font-size:12.5px; font-weight:700; text-anchor:middle; }
      .note { fill:#64748b; font-size:13px; text-anchor:middle; }
    </style>
  </defs>
  <rect width="800" height="600" fill="#fff"/>

  <text class="head" x="400" y="42">四种编排：谁跟谁说话</text>
  <text class="sub" x="400" y="74">能用的结构就这四种，区别在于「谁说了算」清不清楚</text>

  <!-- ① 主管-工人 -->
  <rect x="30" y="88" width="350" height="222" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <circle cx="58" cy="113" r="5" fill="#3b82f6"/>
  <text class="ct" x="72" y="118">主管-工人</text>
  <text class="cn" x="54" y="140">工人只读，主管只写 · 适合可并行的信息收集</text>
  <rect x="155" y="160" width="100" height="34" rx="10" fill="#3b82f6"/>
  <text class="n" x="205" y="182" fill="#fff">主管</text>
  <g stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <path d="M205 194L105 246"/><path d="M205 194V246"/><path d="M205 194L305 246"/>
  </g>
  <g fill="#fff" stroke="#3b82f6" stroke-width="2">
    <rect x="68" y="250" width="74" height="34" rx="10"/>
    <rect x="168" y="250" width="74" height="34" rx="10"/>
    <rect x="268" y="250" width="74" height="34" rx="10"/>
  </g>
  <g fill="#0f172a" font-size="12.5" text-anchor="middle">
    <text x="105" y="272">工人</text><text x="205" y="272">工人</text><text x="305" y="272">工人</text>
  </g>

  <!-- ② 流水线 -->
  <rect x="420" y="88" width="350" height="222" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <circle cx="448" cy="113" r="5" fill="#10b981"/>
  <text class="ct" x="462" y="118">流水线</text>
  <text class="cn" x="444" y="140">写操作串行，逐段交接 · 适合有明确阶段的长流程</text>
  <g fill="#fff" stroke="#10b981" stroke-width="2">
    <rect x="456" y="190" width="80" height="48" rx="12"/>
    <rect x="556" y="190" width="80" height="48" rx="12"/>
    <rect x="656" y="190" width="80" height="48" rx="12"/>
  </g>
  <g fill="#0f172a" font-size="12.5" text-anchor="middle">
    <text x="496" y="212">阶段一</text><text x="496" y="229" fill="#64748b" font-size="11">写</text>
    <text x="596" y="212">阶段二</text><text x="596" y="229" fill="#64748b" font-size="11">写</text>
    <text x="696" y="212">阶段三</text><text x="696" y="229" fill="#64748b" font-size="11">写</text>
  </g>
  <g stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <path d="M536 214H552"/><path d="M636 214H652"/>
  </g>

  <!-- ③ 生成-验证 -->
  <rect x="30" y="326" width="350" height="222" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <circle cx="58" cy="351" r="5" fill="#f59e0b"/>
  <text class="ct" x="72" y="356">生成-验证</text>
  <text class="cn" x="54" y="378">一个写，一个用干净上下文审 · 适合需要挑错的产出</text>
  <g fill="#fff" stroke-width="2">
    <rect x="58" y="420" width="78" height="48" rx="12" stroke="#3b82f6"/>
    <rect x="166" y="420" width="78" height="48" rx="12" stroke="#94a3b8"/>
    <rect x="274" y="420" width="78" height="48" rx="12" stroke="#f59e0b"/>
  </g>
  <g fill="#0f172a" font-size="12" text-anchor="middle">
    <text x="97" y="442">生成者</text><text x="97" y="458" fill="#64748b" font-size="11">有上下文</text>
    <text x="205" y="442">产物</text><text x="205" y="458" fill="#64748b" font-size="11">diff</text>
    <text x="313" y="442">验证者</text><text x="313" y="458" fill="#64748b" font-size="11">干净上下文</text>
  </g>
  <g stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <path d="M136 444H162"/><path d="M244 444H270"/>
  </g>
  <path d="M313 468V500H97V472" fill="none" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text class="cn" x="205" y="518" text-anchor="middle" fill="#b45309">只把问题清单带回去</text>

  <!-- ④ 群聊 / 辩论 -->
  <rect x="420" y="326" width="350" height="222" rx="16" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <circle cx="448" cy="351" r="5" fill="#ef4444"/>
  <text class="ct" x="462" y="356">群聊 / 辩论</text>
  <text class="cn" x="444" y="378">人人可读可写 · 理论上最像开会，实践中最难</text>
  <g stroke="#94a3b8" stroke-width="2">
    <path d="M595 412L505 490"/><path d="M595 412L685 490"/><path d="M505 490H685"/>
  </g>
  <g fill="#fff" stroke="#ef4444" stroke-width="2">
    <rect x="553" y="393" width="84" height="38" rx="10"/>
    <rect x="463" y="471" width="84" height="38" rx="10"/>
    <rect x="643" y="471" width="84" height="38" rx="10"/>
  </g>
  <g fill="#0f172a" font-size="12.5" text-anchor="middle">
    <text x="595" y="417">Agent</text><text x="505" y="495">Agent</text><text x="685" y="495">Agent</text>
  </g>
  <text class="cn" x="595" y="536" text-anchor="middle" fill="#b91c1c">谁说了算？没有人</text>

  <text class="note" x="400" y="582">前三种都有明确的决策者，第四种把决策分散给了所有人</text>
</svg>
