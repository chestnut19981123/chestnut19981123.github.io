<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">三篇多 Agent 工程博客的时间线</title>
  <desc id="desc">2025 年 6 月 12 日 Cognition 发布《别做多 Agent》，次日 Anthropic 发布多 Agent 调研系统并报告 90.2% 的提升，10 个月后 Cognition 发布《多 Agent：什么真的有效》，部分改口。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      text { font-family:'PingFang SC','Microsoft YaHei',sans-serif; }
      .head { fill:#0f172a; font-size:23px; font-weight:700; text-anchor:middle; }
      .sub { fill:#64748b; font-size:15px; text-anchor:middle; }
      .date { fill:#0f172a; font-size:15px; font-weight:700; text-anchor:middle; }
      .org { fill:#64748b; font-size:14px; text-anchor:middle; }
      .ttl { fill:#0f172a; font-size:14px; font-weight:700; text-anchor:middle; }
      .verdict { font-size:15px; font-weight:700; text-anchor:middle; }
      .why { fill:#64748b; font-size:13px; text-anchor:middle; }
      .note { fill:#64748b; font-size:13px; text-anchor:middle; }
    </style>
  </defs>
  <rect width="800" height="520" fill="#fff"/>

  <text class="head" x="400" y="42">隔一天，两家公司给出了相反的结论</text>
  <text class="sub" x="400" y="76">三篇工程博客，一年时间，一场关于多 Agent 的公开分歧</text>

  <!-- 时间轴 -->
  <path d="M70 150H726" stroke="#cbd5e1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <g fill="#fff" stroke-width="3">
    <circle cx="160" cy="150" r="8" stroke="#f59e0b"/>
    <circle cx="400" cy="150" r="8" stroke="#3b82f6"/>
    <circle cx="640" cy="150" r="8" stroke="#10b981"/>
  </g>
  <text class="date" x="160" y="124">2025.06.12</text>
  <text class="date" x="400" y="124">2025.06.13</text>
  <text class="date" x="640" y="124">2026.04.22</text>

  <!-- 卡片 1 -->
  <rect x="55" y="182" width="210" height="228" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text class="org" x="160" y="212">Cognition</text>
  <text class="ttl" x="160" y="242">《Don&#39;t Build</text>
  <text class="ttl" x="160" y="264">Multi-Agents》</text>
  <text class="verdict" x="160" y="308" fill="#b45309">别做多 Agent</text>
  <line x1="85" y1="328" x2="235" y2="328" stroke="#fcd9a8" stroke-width="1.5"/>
  <text class="why" x="160" y="354">并行写操作会</text>
  <text class="why" x="160" y="376">互相冲突</text>

  <!-- 卡片 2 -->
  <rect x="295" y="182" width="210" height="228" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text class="org" x="400" y="212">Anthropic</text>
  <text class="ttl" x="400" y="242">《How we built</text>
  <text class="ttl" x="400" y="264">our multi-agent…》</text>
  <text class="verdict" x="400" y="308" fill="#1d4ed8">比单 Agent 高 90.2%</text>
  <line x1="325" y1="328" x2="475" y2="328" stroke="#bfdbfe" stroke-width="1.5"/>
  <text class="why" x="400" y="354">token 用量解释了</text>
  <text class="why" x="400" y="376">80% 的性能差异</text>

  <!-- 卡片 3 -->
  <rect x="535" y="182" width="210" height="228" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text class="org" x="640" y="212">Cognition</text>
  <text class="ttl" x="640" y="242">《Multi-Agents:</text>
  <text class="ttl" x="640" y="264">What&#39;s Actually Working》</text>
  <text class="verdict" x="640" y="308" fill="#047857">写操作单线程</text>
  <line x1="565" y1="328" x2="715" y2="328" stroke="#a7f3d0" stroke-width="1.5"/>
  <text class="why" x="640" y="354">多 Agent 贡献</text>
  <text class="why" x="640" y="376">智能，而非行动</text>

  <!-- 10 个月后的跨度标注 -->
  <path d="M400 434H640" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" fill="none"/>
  <path d="M400 434v-9M640 434v-9" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="note" x="520" y="458">10 个月后，Cognition 部分改口</text>

  <text class="note" x="400" y="496">两篇结论相反，说的却是两种不同的任务——一个读密集，一个写密集</text>
</svg>
