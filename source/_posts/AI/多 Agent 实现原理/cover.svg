<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">多 Agent：一个主管派活，三个工人分头干，结论汇总回来</title>
  <desc id="desc">简洁的横向主视觉：左侧主管把任务派给中间三个并行子 Agent，只有结论回到右侧的汇总卡片。标题安全区保持留白。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF3F8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#334155" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="170" cy="230" r="190" fill="#E7F0FC" opacity=".7"/>
  <circle cx="1110" cy="250" r="190" fill="#E8F4EF" opacity=".72"/>

  <!-- 派活：主管 -> 三个并行子 Agent -->
  <g fill="none" stroke="#A7B6C7" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M425 285C468 285 484 208 527 208"/>
    <path d="M425 285H527"/>
    <path d="M425 285C468 285 484 368 527 368"/>
  </g>

  <!-- 汇总：三个子 Agent -> 结论 -->
  <g fill="none" stroke="#9CCDBB" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M725 208C768 208 784 290 827 290"/>
    <path d="M725 288H827"/>
    <path d="M725 368C768 368 784 290 827 290"/>
  </g>

  <!-- 主管 -->
  <g filter="url(#shadow)">
    <rect x="215" y="190" width="210" height="190" rx="26" fill="#fff" stroke="#D5E0EC" stroke-width="2"/>
  </g>
  <rect x="250" y="230" width="90" height="13" rx="6.5" fill="#8DBCF0"/>
  <rect x="250" y="266" width="140" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="250" y="292" width="110" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="250" y="322" width="140" height="30" rx="9" fill="#EAF3FF"/>
  <rect x="266" y="332" width="100" height="10" rx="5" fill="#8DBCF0"/>

  <!-- 三个子 Agent -->
  <g filter="url(#shadow)">
    <rect x="535" y="170" width="190" height="76" rx="18" fill="#fff" stroke="#DCE6F2" stroke-width="2"/>
    <rect x="535" y="250" width="190" height="76" rx="18" fill="#fff" stroke="#DCE6F2" stroke-width="2"/>
    <rect x="535" y="330" width="190" height="76" rx="18" fill="#fff" stroke="#DCE6F2" stroke-width="2"/>
  </g>
  <g>
    <circle cx="567" cy="208" r="9" fill="#BFDBFE"/>
    <rect x="590" y="194" width="110" height="9" rx="4.5" fill="#CBD5E1"/>
    <rect x="590" y="213" width="80" height="9" rx="4.5" fill="#E2E8F0"/>

    <circle cx="567" cy="288" r="9" fill="#BFDBFE"/>
    <rect x="590" y="274" width="110" height="9" rx="4.5" fill="#CBD5E1"/>
    <rect x="590" y="293" width="80" height="9" rx="4.5" fill="#E2E8F0"/>

    <circle cx="567" cy="368" r="9" fill="#BFDBFE"/>
    <rect x="590" y="354" width="110" height="9" rx="4.5" fill="#CBD5E1"/>
    <rect x="590" y="373" width="80" height="9" rx="4.5" fill="#E2E8F0"/>
  </g>

  <!-- 结论 -->
  <g filter="url(#shadow)">
    <rect x="835" y="205" width="230" height="170" rx="26" fill="#fff" stroke="#D5E4DE" stroke-width="2"/>
  </g>
  <rect x="870" y="245" width="80" height="13" rx="6.5" fill="#78BFA6"/>
  <rect x="870" y="281" width="160" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="870" y="307" width="130" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="870" y="337" width="160" height="30" rx="9" fill="#EAF6F1"/>
  <rect x="886" y="347" width="120" height="10" rx="5" fill="#78BFA6"/>

  <!-- 承托画面：只有结论回到主管的上下文 -->
  <rect x="215" y="500" width="850" height="150" rx="30" fill="#fff" stroke="#D7E1EB" stroke-width="2"/>
  <path d="M498 526V560M781 526V560" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="255" y="526" width="212" height="34" rx="11" fill="#F1F5F9"/>
  <rect x="283" y="538" width="156" height="10" rx="5" fill="#9AAABD"/>
  <rect x="538" y="526" width="212" height="34" rx="11" fill="#EFF6FF"/>
  <rect x="566" y="538" width="156" height="10" rx="5" fill="#9FC5F3"/>
  <rect x="821" y="526" width="212" height="34" rx="11" fill="#F0F8F4"/>
  <rect x="849" y="538" width="156" height="10" rx="5" fill="#84BFA9"/>
</svg>
