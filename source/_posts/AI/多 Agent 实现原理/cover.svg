<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">多 Agent：分头思考，协作完成</title>
  <desc id="desc">蓝紫色柔光中，一个居中的主管机器人向左右两个对称的子 Agent 分派任务，两侧的圆润曲线将结果汇入下方的答案。机器人采用白色外壳、深蓝面板和青色眼睛，与 Agent 实现原理的封面呼应；蓝紫渐变与青色高光增加色彩层次。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFF"/>
      <stop offset=".5" stop-color="#F2F5FF"/>
      <stop offset="1" stop-color="#F3F0FC"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop stop-color="#93C5FD" stop-opacity=".48"/>
      <stop offset="1" stop-color="#93C5FD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop stop-color="#C4B5FD" stop-opacity=".48"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x1="-.7" y1="0" x2=".7" y2="1">
      <stop stop-color="#FFF"/>
      <stop offset=".55" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#DCE5FF"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101A42"/>
      <stop offset=".6" stop-color="#1E2B59"/>
      <stop offset="1" stop-color="#303A72"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3B82F6"/>
      <stop offset=".55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="route" x1="300" y1="300" x2="980" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset=".5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="eye">
      <stop stop-color="#CFFAFE"/>
      <stop offset=".5" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4858A8" flood-opacity=".18"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748B"/>
    </marker>
    <!-- All Agent heads reuse one symbol: equal colour, details and proportions. -->
    <g id="agent">
      <path d="M0-80V-100" stroke="#9FAEF4" stroke-width="7" stroke-linecap="round"/>
      <circle cy="-105" r="10" fill="url(#accent)"/>
      <rect x="-104" y="-12" width="26" height="45" rx="12" fill="#BAC9F5"/>
      <rect x="78" y="-12" width="26" height="45" rx="12" fill="#BAC9F5"/>
      <rect x="-90" y="-76" width="180" height="150" rx="49" fill="url(#shell)" stroke="#FFF" stroke-width="2" filter="url(#shadow)"/>
      <rect x="-69" y="-41" width="138" height="89" rx="31" fill="url(#face)"/>
      <path d="M-45-30H28" stroke="#7C8FC4" stroke-opacity=".16" stroke-width="3" stroke-linecap="round"/>
      <g fill="#22D3EE" opacity=".5" filter="url(#glow)">
        <circle cx="-29" cy="-2" r="13"/>
        <circle cx="29" cy="-2" r="13"/>
      </g>
      <g fill="url(#eye)">
        <circle cx="-29" cy="-2" r="10"/>
        <circle cx="29" cy="-2" r="10"/>
      </g>
      <path d="M-23 22Q0 36 23 22" fill="none" stroke="#8CE5F4" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="-25" y="59" width="50" height="5" rx="2.5" fill="#B8C6F5"/>
    </g>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="355" cy="300" rx="450" ry="340" fill="url(#blueGlow)"/>
  <ellipse cx="925" cy="330" rx="450" ry="340" fill="url(#violetGlow)"/>
  <ellipse cx="640" cy="610" rx="320" ry="140" fill="url(#blueGlow)" opacity=".6"/>

  <!-- The supervisor's halo groups the main illustration without a UI card. -->
  <circle cx="640" cy="230" r="156" fill="#DDE4FF" opacity=".3"/>
  <circle cx="640" cy="230" r="122" fill="#C7D2FE" opacity=".28"/>

  <!-- Mathematically mirrored task and result paths. -->
  <g fill="none" stroke="url(#route)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M516 236C448 236 458 310 398 310"/>
    <path d="M764 236C832 236 822 310 882 310"/>
    <path d="M300 408C300 508 370 575 482 575"/>
    <path d="M980 408C980 508 910 575 798 575"/>
  </g>

  <use href="#agent" transform="translate(640 232) scale(1.18)"/>
  <use href="#agent" transform="translate(300 332) scale(.9)"/>
  <use href="#agent" transform="translate(980 332) scale(.9)"/>

  <!-- One answer receives the two independent results. -->
  <rect x="514" y="529" width="252" height="124" rx="28" fill="#DCD8FC" transform="rotate(5 640 591)"/>
  <rect x="514" y="519" width="252" height="124" rx="28" fill="#DBEAFE" transform="rotate(-5 640 581)"/>
  <rect x="492" y="512" width="296" height="126" rx="28" fill="url(#shell)" stroke="#FFF" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="547" cy="575" r="29" fill="url(#accent)"/>
  <path d="M534 575L543 584L560 566" fill="none" stroke="#FFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="597" y="548" width="139" height="11" rx="5.5" fill="#7F8EE4"/>
  <rect x="597" y="572" width="114" height="9" rx="4.5" fill="#B6C3E7"/>
  <rect x="597" y="594" width="139" height="9" rx="4.5" fill="#CBD5EB"/>
</svg>
