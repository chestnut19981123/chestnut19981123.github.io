<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F8FA"/>
      <stop offset="1" stop-color="#E9EDF2"/>
    </linearGradient>

    <linearGradient id="core" x1="500" y1="170" x2="1110" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="accent" x1="700" y1="270" x2="1010" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <filter id="shadow" x="350" y="80" width="900" height="760" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="30" stdDeviation="35" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>

    <filter id="soft" x="-100" y="-100" width="1800" height="1100" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="70"/>
    </filter>

    <clipPath id="panelClip">
      <rect x="485" y="145" width="630" height="610" rx="32"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle ambient glow -->
  <circle cx="330" cy="190" r="180" fill="#93C5FD" opacity="0.14" filter="url(#soft)"/>
  <circle cx="1320" cy="720" r="230" fill="#CBD5E1" opacity="0.35" filter="url(#soft)"/>

  <!-- Minimal grid -->
  <g opacity="0.28" stroke="#CBD5E1" stroke-width="1">
    <path d="M0 180H1600"/>
    <path d="M0 360H1600"/>
    <path d="M0 540H1600"/>
    <path d="M0 720H1600"/>
    <path d="M200 0V900"/>
    <path d="M400 0V900"/>
    <path d="M600 0V900"/>
    <path d="M800 0V900"/>
    <path d="M1000 0V900"/>
    <path d="M1200 0V900"/>
    <path d="M1400 0V900"/>
  </g>

  <!-- Central system panel -->
  <g filter="url(#shadow)">
    <rect x="485" y="145" width="630" height="610" rx="32" fill="white"/>
    <rect x="485.5" y="145.5" width="629" height="609" rx="31.5" stroke="#D7DDE5"/>
  </g>

  <!-- Header bar -->
  <rect x="485" y="145" width="630" height="74" rx="32" fill="#F8FAFC"/>
  <path d="M485 187H1115V219H485V187Z" fill="#F8FAFC"/>
  <line x1="485" y1="219" x2="1115" y2="219" stroke="#E2E8F0"/>

  <circle cx="523" cy="182" r="7" fill="#CBD5E1"/>
  <circle cx="547" cy="182" r="7" fill="#CBD5E1"/>
  <circle cx="571" cy="182" r="7" fill="#CBD5E1"/>

  <!-- Abstract prompt structure -->
  <g clip-path="url(#panelClip)">
    <!-- Left hierarchy -->
    <rect x="535" y="267" width="5" height="328" rx="2.5" fill="#E2E8F0"/>

    <rect x="565" y="263" width="190" height="12" rx="6" fill="#CBD5E1"/>
    <rect x="565" y="291" width="285" height="9" rx="4.5" fill="#E2E8F0"/>
    <rect x="565" y="314" width="230" height="9" rx="4.5" fill="#E2E8F0"/>

    <rect x="565" y="365" width="155" height="12" rx="6" fill="#94A3B8"/>
    <rect x="565" y="393" width="270" height="9" rx="4.5" fill="#E2E8F0"/>
    <rect x="565" y="416" width="205" height="9" rx="4.5" fill="#E2E8F0"/>

    <rect x="565" y="467" width="175" height="12" rx="6" fill="#CBD5E1"/>
    <rect x="565" y="495" width="250" height="9" rx="4.5" fill="#E2E8F0"/>
    <rect x="565" y="518" width="190" height="9" rx="4.5" fill="#E2E8F0"/>

    <!-- Highlighted semantic block -->
    <rect x="550" y="565" width="510" height="108" rx="18" fill="#F1F5F9"/>
    <rect x="574" y="588" width="132" height="10" rx="5" fill="#64748B"/>
    <rect x="574" y="614" width="390" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="574" y="636" width="320" height="8" rx="4" fill="#CBD5E1"/>

    <!-- Right-side structural brackets -->
    <path d="M885 262H1018C1029 262 1038 271 1038 282V331"
          stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <path d="M885 349H1038V438"
          stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <path d="M885 456H1038V535"
          stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>

    <!-- Blue semantic nodes -->
    <circle cx="1038" cy="331" r="9" fill="url(#accent)"/>
    <circle cx="1038" cy="438" r="9" fill="url(#accent)"/>
    <circle cx="1038" cy="535" r="9" fill="url(#accent)"/>

    <line x1="1038" y1="331" x2="1074" y2="331" stroke="#93C5FD" stroke-width="2"/>
    <line x1="1038" y1="438" x2="1074" y2="438" stroke="#93C5FD" stroke-width="2"/>
    <line x1="1038" y1="535" x2="1074" y2="535" stroke="#93C5FD" stroke-width="2"/>

    <rect x="1074" y="325" width="62" height="12" rx="6" fill="#BFDBFE"/>
    <rect x="1074" y="432" width="48" height="12" rx="6" fill="#BFDBFE"/>
    <rect x="1074" y="529" width="68" height="12" rx="6" fill="#BFDBFE"/>
  </g>

  <!-- Central "system core" abstraction -->
  <g>
    <circle cx="800" cy="450" r="108" fill="#0F172A" opacity="0.06"/>
    <circle cx="800" cy="450" r="76" fill="url(#core)"/>
    <circle cx="800" cy="450" r="53" fill="#0F172A"/>

    <!-- Layered brackets / anatomy -->
    <path d="M776 417L800 399L824 417V449L800 467L776 449V417Z"
          stroke="url(#accent)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M776 483L800 501L824 483"
          stroke="#64748B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="800" cy="450" r="7" fill="#60A5FA"/>

    <!-- Orbiting connection lines -->
    <path d="M800 374V344" stroke="#94A3B8" stroke-width="2"/>
    <path d="M876 450H906" stroke="#94A3B8" stroke-width="2"/>
    <path d="M800 526V556" stroke="#94A3B8" stroke-width="2"/>
    <path d="M724 450H694" stroke="#94A3B8" stroke-width="2"/>

    <circle cx="800" cy="340" r="5" fill="#CBD5E1"/>
    <circle cx="910" cy="450" r="5" fill="#CBD5E1"/>
    <circle cx="800" cy="560" r="5" fill="#CBD5E1"/>
    <circle cx="690" cy="450" r="5" fill="#CBD5E1"/>
  </g>

  <!-- External abstraction nodes -->
  <g stroke="#94A3B8" stroke-width="2">
    <path d="M485 285H415L375 325"/>
    <path d="M1115 285H1185L1225 325"/>
    <path d="M485 625H405L365 585"/>
    <path d="M1115 625H1195L1235 585"/>
  </g>

  <g fill="white" stroke="#CBD5E1" stroke-width="2">
    <circle cx="375" cy="325" r="14"/>
    <circle cx="1225" cy="325" r="14"/>
    <circle cx="365" cy="585" r="14"/>
    <circle cx="1235" cy="585" r="14"/>
  </g>

  <!-- Small geometric marks -->
  <g stroke="#64748B" stroke-width="2" opacity="0.65">
    <path d="M170 690h54"/>
    <path d="M197 663v54"/>
    <path d="M1375 215h54"/>
    <path d="M1402 188v54"/>
  </g>

  <!-- No title / no text -->
</svg>