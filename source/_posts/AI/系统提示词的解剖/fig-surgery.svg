<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="400" y="31"
        fill="#0f172a"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="21"
        font-weight="700"
        text-anchor="middle">改前 vs 改后：手动加一章</text>

  <!-- Left panel -->
  <g filter="url(#shadow)">
    <rect x="55" y="78" width="310" height="282" rx="14"
          fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <rect x="55" y="78" width="310" height="48" rx="14" fill="#f1f5f9"/>
  <rect x="55" y="112" width="310" height="14" fill="#f1f5f9"/>

  <text x="78" y="108"
        fill="#0f172a"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="19"
        font-weight="700">改前</text>

  <text x="342" y="106"
        fill="#64748b"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="12"
        font-weight="600"
        text-anchor="end">原有注册表</text>

  <g fill="#334155"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="12.5">
    <text x="78" y="157">intro         order=0    global</text>
    <text x="78" y="183">system        order=1    global</text>
    <text x="78" y="209">doing_tasks   order=2    global</text>
    <text x="78" y="235">environment   order=20   request</text>
    <text x="78" y="261">memory        order=25   request</text>
  </g>

  <line x1="78" y1="280" x2="342" y2="280"
        stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="78" y="308"
        fill="#94a3b8"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="12">没有 daily_brief</text>

  <!-- Transformation -->
  <text x="400" y="190"
        fill="#64748b"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="13"
        font-weight="600"
        text-anchor="middle">改造</text>

  <line x1="375" y1="210" x2="425" y2="210"
        stroke="#64748b"
        stroke-width="2.5"
        stroke-linecap="round"
        marker-end="url(#arr)"/>

  <!-- Right panel -->
  <g filter="url(#shadow)">
    <rect x="435" y="78" width="310" height="282" rx="14"
          fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <rect x="435" y="78" width="310" height="48" rx="14" fill="#f1f5f9"/>
  <rect x="435" y="112" width="310" height="14" fill="#f1f5f9"/>

  <text x="458" y="108"
        fill="#0f172a"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="19"
        font-weight="700">改后</text>

  <text x="722" y="106"
        fill="#16a34a"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="12"
        font-weight="600"
        text-anchor="end">新增 1 项</text>

  <g fill="#334155"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="12.5">
    <text x="458" y="157">intro         order=0    global</text>
    <text x="458" y="183">system        order=1    global</text>
    <text x="458" y="209">doing_tasks   order=2    global</text>
  </g>

  <!-- New item -->
  <rect x="452" y="216" width="276" height="30" rx="7"
        fill="#f0fdf4"
        stroke="#22c55e"
        stroke-width="1.8"/>

  <circle cx="468" cy="231" r="4" fill="#22c55e"/>

  <text x="480" y="231"
        fill="#15803d"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12.5"
        font-weight="700"
        dominant-baseline="central">daily_brief   order=55   session</text>

  <text x="713" y="231"
        fill="#16a34a"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="11.5"
        font-weight="700"
        text-anchor="end"
        dominant-baseline="central">新增</text>

  <!-- Move following rows closer to highlight -->
  <g fill="#334155"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="12.5">
    <text x="458" y="263">environment   order=20   request</text>
    <text x="458" y="287">memory        order=25   request</text>
  </g>

  <line x1="458" y1="304" x2="722" y2="304"
        stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="458" y="327"
        fill="#64748b"
        font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="11.5">一次 register_section 调用</text>

  <!-- Bottom legend -->
  <rect x="55" y="382" width="12" height="12" rx="3"
        fill="#f0fdf4"
        stroke="#22c55e"
        stroke-width="1.5"/>

  <text x="75" y="393"
        fill="#64748b"
        font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="12.5">绿底行 = 新注册的章节 · 从无到有</text>
</svg>