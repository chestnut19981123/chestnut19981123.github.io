<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430"><defs><marker id="arr" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="10" refY="5" viewBox="0 0 10 10"><path fill="#64748b" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
<text x="400" y="28" fill="#1e293b" dominant-baseline="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" text-anchor="middle" style="font-weight:600">从一本书，到一本活页夹</text>
<rect x="110" y="90" width="180" height="220" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5" rx="14"/>
<line x1="122" x2="122" y1="98" y2="302" stroke="#bfdbfe" stroke-width="2"/><line x1="132" x2="132" y1="98" y2="302" stroke="#bfdbfe" stroke-width="2"/>
<line x1="282" x2="282" y1="98" y2="302" stroke="#93c5fd" stroke-width="2.5"/>
<text x="200" y="190" fill="#1e293b" dominant-baseline="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" text-anchor="middle" style="font-weight:600">一整段</text>
<text x="200" y="225" fill="#64748b" dominant-baseline="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">整段生成 · 不能局部更换</text>
<text x="200" y="350" fill="#64748b" dominant-baseline="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="middle">改一处 = 全部重来</text>
<line x1="310" x2="490" y1="200" y2="200" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="400" y="188" fill="#64748b" dominant-baseline="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="middle">拆成活页</text>
<rect x="510" y="90" width="180" height="220" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" rx="14"/>
<circle cx="600" cy="106" r="11" fill="none" stroke="#16a34a" stroke-width="2.5"/>
<rect x="544" y="118" width="132" height="150" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="8"/>
<rect x="544" y="150" width="132" height="150" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="8"/>
<rect x="544" y="182" width="132" height="150" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="8"/>
<rect x="656" y="140" width="80" height="140" fill="#ffffff" stroke="#16a34a" stroke-width="2.5" rx="10" transform="rotate(8 656 210)"/>
<text x="600" y="350" fill="#64748b" dominant-baseline="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="middle">改一页 = 抽一张，换一张</text>
</svg>
