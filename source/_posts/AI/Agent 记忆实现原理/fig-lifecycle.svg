<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">一次完整流转：写、读、重读</title>
  <desc id="desc">用户消息进入上下文窗口，模型读窗口并调用工具；每一轮由宿主写进 SQLite，压缩后写入 checkpoint。下次 resume 时从 SQLite 读回 checkpoint 和 keepID 指向的原文；压缩之后，AGENTS.md 还会被重新读一遍并注入窗口。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#10b981"/></marker>
    <style>
      text { font-family:'PingFang SC','Microsoft YaHei',sans-serif; }
      .head { fill:#0f172a; font-size:23px; font-weight:700; text-anchor:middle; }
      .sub { fill:#64748b; font-size:14px; text-anchor:middle; }
      .node { fill:#0f172a; font-size:12px; font-weight:700; }
      .ns { fill:#64748b; font-size:9.5px; }
      .mono { font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace; }
      .cap { fill:#64748b; font-size:11.5px; text-anchor:middle; }
    </style>
  </defs>
  <rect width="800" height="500" fill="#fff"/>

  <text class="head" x="400" y="40">一次完整流转：写、读、重读</text>
  <text class="sub" x="400" y="68">窗口是视图，SQLite 是原文，AGENTS.md 每次都重读</text>

  <!-- AGENTS.md -->
  <rect x="190" y="88" width="120" height="44" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <path d="M202 98h9l4 4v12h-13z" fill="#fff" stroke="#10b981" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="224" y="110" fill="#047857" font-size="10.5" font-weight="700">AGENTS.md</text>
  <text x="224" y="124" fill="#047857" font-size="9.5">项目约定</text>
  <path d="M250 132V156" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="258" y="148" fill="#047857" font-size="10">注入</text>

  <!-- 压缩后重读 -->
  <path d="M725 160V118Q725 110 717 110H320" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="520" y="102" text-anchor="middle" fill="#64748b" font-size="10">压缩后重读</text>

  <!-- 顶层节点 -->
  <rect x="40" y="160" width="100" height="80" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="64" cy="184" r="6" fill="#94a3b8"/>
  <path d="M54 204c0-6 4-10 10-10s10 4 10 10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <text class="node" x="80" y="192">用户消息</text>
  <text class="ns" x="80" y="210">一句话</text>

  <rect x="180" y="160" width="140" height="80" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="196" y="178" width="24" height="18" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1.5"/>
  <path d="M196 184H220" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="201" cy="181.5" r="1" fill="#3b82f6"/><circle cx="205" cy="181.5" r="1" fill="#3b82f6"/>
  <text class="node" x="228" y="192" fill="#1e3a8a">上下文窗口</text>
  <text class="ns" x="228" y="210" fill="#1e3a8a">工作记忆</text>

  <rect x="360" y="160" width="140" height="80" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="376" y="180" width="18" height="16" rx="3" fill="#fff" stroke="#6366f1" stroke-width="1.5"/>
  <path d="M380 176V180M386 176V180M390 176V180M380 196V200M386 196V200M390 196V200M372 184H376M372 190H376M394 184H398M394 190H398" stroke="#6366f1" stroke-width="1.2"/>
  <text class="node" x="404" y="192" fill="#3730a3">模型 + 工具</text>
  <text class="ns" x="404" y="210" fill="#3730a3">读 / 调 / 回</text>

  <rect x="540" y="160" width="110" height="80" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <path d="M556 178H570M556 196H570M558 178C558 184 564 186 564 188C564 190 558 192 558 196M568 178C568 184 562 186 562 188C562 190 568 192 568 196" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
  <text class="node" x="582" y="192" fill="#92400e">压缩</text>
  <text class="ns" x="582" y="210" fill="#92400e">到 ceiling</text>

  <rect x="680" y="160" width="90" height="80" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="node" x="725" y="192" text-anchor="middle" font-size="10.5" fill="#334155">checkpoint</text>
  <text class="ns" x="725" y="210" text-anchor="middle" fill="#64748b">+ keepID</text>

  <!-- 顶层流转 -->
  <path d="M140 201H176" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M320 201H356" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M500 201H536" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M650 201H676" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SQLite -->
  <text x="52" y="402" fill="#475569" font-size="11.5" font-weight="700">SQLite · 会话记忆</text>
  <text x="770" y="322" text-anchor="end" fill="#64748b" font-size="10">原文只存一份</text>
  <rect x="40" y="330" width="730" height="80" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="56" y="348" width="90" height="30" rx="15" fill="#fff" stroke="#64748b" stroke-width="1.2"/>
  <text x="101" y="368" text-anchor="middle" fill="#334155" font-size="11" font-weight="700">resume</text>

  <rect x="180" y="348" width="240" height="32" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text class="mono" x="300" y="369" text-anchor="middle" fill="#475569" font-size="10">messages</text>
  <rect x="432" y="348" width="158" height="32" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text class="mono" x="511" y="369" text-anchor="middle" fill="#475569" font-size="10">compaction</text>
  <rect x="602" y="348" width="142" height="32" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text class="mono" x="673" y="369" text-anchor="middle" fill="#475569" font-size="9.5">instruction_state</text>

  <!-- 写 -->
  <path d="M280 240V326" fill="none" stroke="#10b981" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="288" y="285" fill="#047857" font-size="10.5">写</text>
  <path d="M430 240V326" fill="none" stroke="#10b981" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="438" y="285" fill="#047857" font-size="10.5">写</text>
  <path d="M595 240V326" fill="none" stroke="#10b981" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="603" y="285" fill="#047857" font-size="10">写 checkpoint</text>

  <!-- 读 -->
  <path d="M101 348V280H190V246" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="116" y="300" fill="#64748b" font-size="10">读 checkpoint + keepID</text>

  <!-- 图例 -->
  <g>
    <path d="M190 440H220" stroke="#10b981" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
    <text x="228" y="444" fill="#64748b" font-size="10.5">写</text>
    <path d="M300 440H330" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <text x="338" y="444" fill="#64748b" font-size="10.5">读 / 重读</text>
    <rect x="470" y="433" width="14" height="14" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="492" y="444" fill="#64748b" font-size="10.5">工作记忆</text>
    <rect x="590" y="433" width="14" height="14" rx="3" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="612" y="444" fill="#64748b" font-size="10.5">压缩</text>
    <rect x="680" y="433" width="14" height="14" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="702" y="444" fill="#64748b" font-size="10.5">存储</text>
  </g>

  <text class="cap" x="400" y="474">压缩只改窗口里的视图；SQLite 和 AGENTS.md 都不动</text>
</svg>
