<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">压缩是视图，不是删除</title>
  <desc id="desc">模型看到的是摘要 S2 加 keepID 之后的最近原文；磁盘上从 E1 到 E19 的消息一条没少。摘要通过 keepID 引用 E5，而不是复制 E5 之后的文本。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      text { font-family:'PingFang SC','Microsoft YaHei',sans-serif; }
      .head { fill:#0f172a; font-size:23px; font-weight:700; text-anchor:middle; }
      .sub { fill:#64748b; font-size:14px; text-anchor:middle; }
      .box { fill:#334155; font-size:12.5px; font-weight:700; }
      .line { fill:#475569; font-size:10.5px; }
      .mono { font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace; }
      .cap { fill:#64748b; font-size:11.5px; text-anchor:middle; }
      .chip { font-size:9.5px; text-anchor:middle; font-weight:700; font-family:'SFMono-Regular',Consolas,monospace; }
      .vchip { font-size:8.5px; text-anchor:middle; font-weight:700; font-family:'SFMono-Regular',Consolas,monospace; }
    </style>
  </defs>
  <rect width="800" height="500" fill="#fff"/>

  <text class="head" x="400" y="40">压缩是视图，不是删除</text>
  <text class="sub" x="400" y="66">模型看到 S2 + 最近原文；磁盘上 19 条消息一条没少（示意）</text>

  <!-- 模型视图 -->
  <text class="mono" x="56" y="104" fill="#64748b" font-size="10">&lt;conversation-checkpoint&gt;</text>
  <rect x="56" y="112" width="688" height="134" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6"/>

  <rect x="72" y="126" width="248" height="106" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="box" x="88" y="148" fill="#1e3a8a">summary</text>
  <text class="mono" x="304" y="148" text-anchor="end" fill="#3b82f6" font-size="11">S2</text>
  <text class="line" x="88" y="166">七段摘要，只记对话</text>
  <text class="line" x="88" y="184">Relevant Files = 路径 + 理由</text>
  <text class="line" x="88" y="202">最近原文不复制，只引用：</text>
  <rect x="88" y="210" width="112" height="16" rx="4" fill="#dbeafe"/>
  <text class="mono" x="96" y="221" fill="#1e3a8a" font-size="9.5">keepID → E5</text>

  <rect x="336" y="126" width="392" height="106" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text class="box" x="352" y="148" fill="#047857">recent-context</text>
  <text class="mono" x="712" y="148" text-anchor="end" fill="#10b981" font-size="10.5">15k</text>

  <g>
    <rect x="352" y="162" width="21" height="22" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text class="vchip" x="362.5" y="177" fill="#047857">E5</text>
    <rect x="376" y="162" width="21" height="22" rx="4" fill="#fff" stroke="#10b981" stroke-width="1.2"/>
    <text class="vchip" x="386.5" y="177" fill="#047857">E6</text>
    <rect x="400" y="162" width="21" height="22" rx="4" fill="#fff" stroke="#10b981" stroke-width="1.2"/>
    <text class="vchip" x="410.5" y="177" fill="#047857">E7</text>
    <rect x="424" y="162" width="21" height="22" rx="4" fill="#fff" stroke="#10b981" stroke-width="1.2"/>
    <text class="vchip" x="434.5" y="177" fill="#047857">E8</text>
    <rect x="448" y="162" width="21" height="22" rx="4" fill="#fff" stroke="#10b981" stroke-width="1.2"/>
    <text class="vchip" x="458.5" y="177" fill="#047857">E9</text>
    <rect x="472" y="162" width="21" height="22" rx="4" fill="#fff" stroke="#10b981" stroke-width="1.2"/>
    <text class="vchip" x="482.5" y="177" fill="#047857">E10</text>
    <rect x="496" y="162" width="21" height="22" rx="4" fill="#fff" stroke="#10b981" stroke-width="1.2"/>
    <text class="vchip" x="506.5" y="177" fill="#047857">E11</text>
    <rect x="520" y="162" width="21" height="22" rx="4" fill="#fff" stroke="#10b981" stroke-width="1.2"/>
    <text class="vchip" x="530.5" y="177" fill="#047857">E12</text>
    <rect x="544" y="162" width="21" height="22" rx="4" fill="#fff" stroke="#10b981" stroke-width="1.2"/>
    <text class="vchip" x="554.5" y="177" fill="#047857">E13</text>
    <rect x="568" y="162" width="21" height="22" rx="4" fill="#fff" stroke="#10b981" stroke-width="1.2"/>
    <text class="vchip" x="578.5" y="177" fill="#047857">E14</text>
    <rect x="592" y="162" width="21" height="22" rx="4" fill="#fff" stroke="#10b981" stroke-width="1.2"/>
    <text class="vchip" x="602.5" y="177" fill="#047857">E15</text>
    <rect x="616" y="162" width="21" height="22" rx="4" fill="#fff" stroke="#10b981" stroke-width="1.2"/>
    <text class="vchip" x="626.5" y="177" fill="#047857">E16</text>
    <rect x="640" y="162" width="21" height="22" rx="4" fill="#fff" stroke="#10b981" stroke-width="1.2"/>
    <text class="vchip" x="650.5" y="177" fill="#047857">E17</text>
    <rect x="664" y="162" width="21" height="22" rx="4" fill="#fff" stroke="#10b981" stroke-width="1.2"/>
    <text class="vchip" x="674.5" y="177" fill="#047857">E18</text>
    <rect x="688" y="162" width="21" height="22" rx="4" fill="#fff" stroke="#10b981" stroke-width="1.2"/>
    <text class="vchip" x="698.5" y="177" fill="#047857">E19</text>
  </g>
  <text class="line" x="352" y="208" fill="#047857">keepID → compaction 之间的原文，加载时在内存里现拼</text>

  <!-- 重建视图 -->
  <path d="M400 304V252" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="414" y="282" fill="#64748b" font-size="10.5">按需重建</text>

  <!-- 磁盘 -->
  <text class="box" x="50" y="298">SQLite · 磁盘</text>
  <text x="750" y="298" text-anchor="end" fill="#64748b" font-size="10.5">19 条消息，一条没少</text>
  <rect x="50" y="306" width="700" height="108" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g>
    <rect x="78" y="322" width="31" height="36" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
    <text class="chip" x="93.5" y="345" fill="#475569">E1</text>
