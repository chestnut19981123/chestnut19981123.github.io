    <text class="chip" x="195.5" y="345" fill="#475569">E4</text>
    <rect x="214" y="322" width="31" height="36" rx="5" fill="#d1fae5" stroke="#10b981" stroke-width="2.2"/>
    <text class="chip" x="229.5" y="345" fill="#047857">E5</text>
    <rect x="248" y="322" width="31" height="36" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <text class="chip" x="263.5" y="345" fill="#047857">E6</text>
    <rect x="282" y="322" width="31" height="36" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <text class="chip" x="297.5" y="345" fill="#047857">E7</text>
    <rect x="316" y="322" width="31" height="36" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <text class="chip" x="331.5" y="345" fill="#047857">E8</text>
    <rect x="350" y="322" width="31" height="36" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <text class="chip" x="365.5" y="345" fill="#047857">E9</text>
    <rect x="384" y="322" width="31" height="36" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <text class="chip" x="399.5" y="345" fill="#047857">E10</text>
    <rect x="418" y="322" width="31" height="36" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <text class="chip" x="433.5" y="345" fill="#047857">E11</text>
    <rect x="452" y="322" width="31" height="36" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <text class="chip" x="467.5" y="345" fill="#047857">E12</text>
    <rect x="486" y="322" width="31" height="36" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <text class="chip" x="501.5" y="345" fill="#047857">E13</text>
    <rect x="520" y="322" width="31" height="36" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <text class="chip" x="535.5" y="345" fill="#047857">E14</text>
    <rect x="554" y="322" width="31" height="36" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <text class="chip" x="569.5" y="345" fill="#047857">E15</text>
    <rect x="588" y="322" width="31" height="36" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <text class="chip" x="603.5" y="345" fill="#047857">E16</text>
    <rect x="622" y="322" width="31" height="36" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <text class="chip" x="637.5" y="345" fill="#047857">E17</text>
    <rect x="656" y="322" width="31" height="36" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <text class="chip" x="671.5" y="345" fill="#047857">E18</text>
    <rect x="690" y="322" width="31" height="36" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <text class="chip" x="705.5" y="345" fill="#047857">E19</text>
  </g>

  <path d="M78 366V372H211V366" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="144.5" y="388" text-anchor="middle" fill="#64748b" font-size="10.5">被摘要</text>
  <path d="M214 366V372H721V366" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <text x="467.5" y="388" text-anchor="middle" fill="#047857" font-size="10.5">keepID 之后：原文仍在</text>

  <!-- keepID 引用 -->
  <path d="M200 226C200 280 229 280 229 320" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="238" y="286" fill="#64748b" font-size="10.5" font-family="'SFMono-Regular',Consolas,monospace">keepID</text>

  <text class="cap" x="400" y="442">摘要存的是 keepID（一个 ID），不是那 15 条消息的副本</text>

  <g>
    <rect x="210" y="462" width="12" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="228" y="472" fill="#64748b" font-size="10.5">被摘要</text>
    <rect x="330" y="462" width="12" height="12" rx="3" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <text x="348" y="472" fill="#64748b" font-size="10.5">keepID 之后保留</text>
    <rect x="470" y="462" width="12" height="12" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="488" y="472" fill="#64748b" font-size="10.5">模型看到的视图</text>
  </g>
</svg>
