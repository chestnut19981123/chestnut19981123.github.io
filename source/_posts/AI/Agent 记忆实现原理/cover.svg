<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Agent 记忆：窗口、会话与仓库</title>
  <desc id="desc">浅蓝紫渐变中，中央是蓝色的上下文窗口，左侧是灰色的 SQLite 会话库，右侧是灰色的 AGENTS.md 文件。窗口向右下写入会话库，会话库以虚线读回窗口，AGENTS.md 向左注入窗口，形成两进一出的对称结构。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFF"/>
      <stop offset=".5" stop-color="#F2F5FF"/>
      <stop offset="1" stop-color="#F3F0FC"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop stop-color="#93C5FD" stop-opacity=".45"/>
      <stop offset="1" stop-color="#93C5FD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop stop-color="#C4B5FD" stop-opacity=".42"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="windowShell" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F0FF"/>
    </linearGradient>
    <linearGradient id="windowTop" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="dbShell" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="fileShell" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3B82F6"/>
      <stop offset=".55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#4858A8" flood-opacity=".16"/>
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#10B981"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="360" cy="300" rx="430" ry="330" fill="url(#blueGlow)"/>
  <ellipse cx="930" cy="320" rx="430" ry="330" fill="url(#violetGlow)"/>
  <ellipse cx="640" cy="610" rx="330" ry="130" fill="url(#blueGlow)" opacity=".55"/>

  <!-- 左侧：SQLite 会话库 -->
  <g filter="url(#shadow)">
    <path d="M170 236C170 214 230 196 300 196C370 196 430 214 430 236V334C430 356 370 374 300 374C230 374 170 356 170 334Z" fill="url(#dbShell)" stroke="#CBD5E1" stroke-width="2"/>
    <ellipse cx="300" cy="236" rx="130" ry="40" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
    <ellipse cx="300" cy="236" rx="94" ry="25" fill="none" stroke="#94A3B8" stroke-width="2" opacity=".55"/>
    <path d="M170 284C170 306 230 324 300 324C370 324 430 306 430 284" fill="none" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M170 332C170 354 230 372 300 372C370 372 430 354 430 332" fill="none" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="238" y="254" width="124" height="10" rx="5" fill="#94A3B8" opacity=".55"/>
    <rect x="252" y="276" width="96" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="238" y="302" width="124" height="10" rx="5" fill="#94A3B8" opacity=".45"/>
    <rect x="252" y="324" width="96" height="10" rx="5" fill="#CBD5E1"/>
  </g>

  <!-- 中央：上下文窗口 -->
  <g filter="url(#shadow)">
    <rect x="510" y="190" width="260" height="190" rx="26" fill="url(#windowShell)" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="510" y="190" width="260" height="44" rx="26" fill="url(#windowTop)"/>
    <rect x="510" y="216" width="260" height="18" fill="url(#windowTop)"/>
    <circle cx="536" cy="212" r="5" fill="#FFFFFF" opacity=".85"/>
    <circle cx="554" cy="212" r="5" fill="#FFFFFF" opacity=".6"/>
    <circle cx="572" cy="212" r="5" fill="#FFFFFF" opacity=".4"/>
    <rect x="536" y="256" width="150" height="10" rx="5" fill="#93C5FD"/>
    <rect x="536" y="280" width="190" height="10" rx="5" fill="#BFDBFE"/>
    <rect x="536" y="304" width="120" height="10" rx="5" fill="#93C5FD"/>
    <rect x="536" y="328" width="168" height="10" rx="5" fill="#DBEAFE"/>
    <circle cx="736" cy="352" r="14" fill="url(#accent)"/>
    <path d="M729 352L734 357L743 347" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 右侧：AGENTS.md -->
  <g filter="url(#shadow)">
    <path d="M880 206C880 198 886 192 894 192H1016L1060 236V354C1060 362 1054 368 1046 368H894C886 368 880 362 880 354Z" fill="url(#fileShell)" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M1016 192V228C1016 234 1020 238 1026 238H1060" fill="none" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="912" y="258" width="116" height="10" rx="5" fill="#94A3B8" opacity=".55"/>
    <rect x="912" y="282" width="92" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="912" y="306" width="116" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="912" y="330" width="72" height="10" rx="5" fill="#CBD5E1"/>
    <circle cx="1032" cy="336" r="15" fill="#10B981" opacity=".16"/>
    <path d="M1025 336L1030 341L1039 330" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 两进一出：窗口写库、库读回、文件注入 -->
  <g fill="none" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowGreen)">
    <path d="M510 258H430"/>
    <path d="M880 258H770"/>
  </g>
  <path d="M430 312H506" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrowGray)"/>

  <ellipse cx="640" cy="566" rx="300" ry="34" fill="#C7D2FE" opacity=".18"/>
</svg>
