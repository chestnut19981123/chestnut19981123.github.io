<text x="400" y="392" fill="#64748b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" text-anchor="middle">可重试：429 / 5xx / 断网 —— SDK 已内置退避（默认 2 次）；400 / 401 / 403：先改请求，重试无用</text>
