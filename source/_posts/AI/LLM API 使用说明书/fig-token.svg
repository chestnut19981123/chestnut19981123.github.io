<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520"><defs><marker id="arr" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#64748b" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
<rect width="800" height="520" fill="#fff"/>
<text x="400" y="32" fill="#1e293b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" text-anchor="middle" style="font-weight:700">Token：把话切碎，按片计价</text>
<rect width="150" height="48" x="325" y="62" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5" rx="24"/><text x="400" y="87" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="13" text-anchor="middle" style="font-weight:700">这个接口按词元计费</text>
<line x1="400" x2="400" y1="114" y2="146" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
<rect width="48" height="46" x="263" y="150" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="10"/><text x="287" y="175" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="15" text-anchor="middle" style="font-weight:700">这个</text>
<rect width="48" height="46" x="323" y="150" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="10"/><text x="347" y="175" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="15" text-anchor="middle" style="font-weight:700">接口</text>
<rect width="34" height="46" x="383" y="150" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="10"/><text x="400" y="175" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="15" text-anchor="middle" style="font-weight:700">按</text>
<rect width="48" height="46" x="429" y="150" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="10"/><text x="453" y="175" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="15" text-anchor="middle" style="font-weight:700">词元</text>
<rect width="48" height="46" x="489" y="150" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="10"/><text x="513" y="175" fill="#1e293b" dominant-baseline="middle" font-family="monospace" font-size="15" text-anchor="middle" style="font-weight:700">计费</text>
<text x="400" y="224" fill="#64748b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" text-anchor="middle">9 个字切成 5 片——token 不是字，切法各家还不一样，别自己数，看 usage 才准</text>
<text x="400" y="252" fill="#1e293b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" text-anchor="middle" style="font-weight:700">上下文窗口：一次请求最多能带多少片</text>
<rect width="580" height="52" x="110" y="268" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" rx="26"/>
<rect width="360" height="40" x="116" y="274" fill="#3b82f6" rx="20"/><text x="296" y="295" fill="#fff" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" text-anchor="middle">历史 + 本轮输入（每轮变长）</text>
<text x="588" y="295" fill="#64748b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" text-anchor="middle">剩余窗口</text>
<text x="400" y="344" fill="#64748b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" text-anchor="middle">塞满了？最早的内容被挤出去 —— 本节末尾有省钱的招</text>
<text x="400" y="382" fill="#1e293b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" text-anchor="middle" style="font-weight:700">计费不对称：输出比输入贵</text>
<rect width="180" height="72" x="170" y="404" fill="#f8fafc" stroke="#334155" stroke-width="2.5" rx="16"/><text x="260" y="428" fill="#1e293b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" text-anchor="middle" style="font-weight:700">输入</text><text x="260" y="456" fill="#64748b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" text-anchor="middle">prompt 侧：便宜</text>
<circle cx="400" cy="440" r="21" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="400" y="446" fill="#64748b" dominant-baseline="middle" font-family="monospace" font-size="14" text-anchor="middle" style="font-weight:700">≈3x</text>
<rect width="180" height="72" x="450" y="404" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5" rx="16"/><text x="540" y="428" fill="#1e293b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" text-anchor="middle" style="font-weight:700">输出</text><text x="540" y="456" fill="#64748b" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" text-anchor="middle">生成侧：贵（各家不一）</text>
</svg>