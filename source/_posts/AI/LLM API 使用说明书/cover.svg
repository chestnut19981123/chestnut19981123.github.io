<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#94a3b8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <circle cx="250" cy="150" r="260" fill="url(#glow)"/>
  <circle cx="1370" cy="720" r="300" fill="url(#glow)"/>

  <!-- central API flow illustration -->
  <g filter="url(#shadow)">
    <rect x="430" y="260" width="740" height="380" rx="40" fill="#ffffff"/>
  </g>

  <!-- left command block -->
  <rect x="500" y="350" width="210" height="150" rx="24" fill="#f8fafc" stroke="#dbeafe" stroke-width="2"/>
  <circle cx="535" cy="390" r="10" fill="#38bdf8"/>
  <circle cx="570" cy="390" r="10" fill="#93c5fd"/>
  <circle cx="605" cy="390" r="10" fill="#cbd5e1"/>
  <path d="M535 440 H665" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <path d="M535 470 H625" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>

  <!-- transformation arrows -->
  <path d="M750 425 C810 425 820 425 870 425" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
  <path d="M850 400 L885 425 L850 450" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- LLM core -->
  <rect x="900" y="330" width="180" height="190" rx="32" fill="url(#node)"/>
  <circle cx="990" cy="405" r="42" fill="#ffffff" fill-opacity="0.95"/>
  <path d="M965 405 H1015 M990 380 V430" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <circle cx="940" cy="560" r="8" fill="#38bdf8"/>
  <circle cx="990" cy="560" r="8" fill="#60a5fa"/>
  <circle cx="1040" cy="560" r="8" fill="#93c5fd"/>

  <!-- surrounding network -->
  <g stroke="#bfdbfe" stroke-width="3" fill="none">
    <path d="M350 430 L430 430"/>
    <path d="M1170 430 L1300 350"/>
    <path d="M1170 470 L1300 550"/>
    <path d="M990 250 L990 180"/>
  </g>

  <g fill="#ffffff" stroke="#bfdbfe" stroke-width="3">
    <circle cx="330" cy="430" r="22"/>
    <circle cx="1320" cy="350" r="22"/>
    <circle cx="1320" cy="550" r="22"/>
    <circle cx="990" cy="160" r="22"/>
  </g>

  <!-- subtle bottom data layers -->
  <g opacity="0.45">
    <rect x="560" y="700" width="480" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="650" y="735" width="300" height="12" rx="6" fill="#e2e8f0"/>
  </g>
</svg>