<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .lbl { font-size: 21px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
    .cap { font-size: 15px; fill: #64748b; text-anchor: middle; }
  </style>

  <!-- ══════════ 面板 L：a[2] 整数 → 剥掉一层括号 ══════════ -->
  <text class="lbl" x="248" y="100">a[2]：整数取指定</text>

  <!-- 源网格 3×4（0..11），第 2 行高亮 -->
  <g fill="#f8fafc" stroke="#334155" stroke-width="2.5">
    <rect x="156" y="140" width="40" height="40" rx="9"/>
    <rect x="204" y="140" width="40" height="40" rx="9"/>
    <rect x="252" y="140" width="40" height="40" rx="9"/>
    <rect x="300" y="140" width="40" height="40" rx="9"/>
    <rect x="156" y="188" width="40" height="40" rx="9"/>
    <rect x="204" y="188" width="40" height="40" rx="9"/>
    <rect x="252" y="188" width="40" height="40" rx="9"/>
    <rect x="300" y="188" width="40" height="40" rx="9"/>
  </g>
  <g fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5">
    <rect x="156" y="236" width="40" height="40" rx="9"/>
    <rect x="204" y="236" width="40" height="40" rx="9"/>
    <rect x="252" y="236" width="40" height="40" rx="9"/>
    <rect x="300" y="236" width="40" height="40" rx="9"/>
  </g>
  <g font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">
    <text x="176" y="164">0</text>
    <text x="224" y="164">1</text>
    <text x="272" y="164">2</text>
    <text x="320" y="164">3</text>
    <text x="176" y="212">4</text>
    <text x="224" y="212">5</text>
    <text x="272" y="212">6</text>
    <text x="320" y="212">7</text>
  </g>
  <g font-size="18" font-weight="600" fill="#1d4ed8" text-anchor="middle">
    <text x="176" y="260">8</text>
    <text x="224" y="260">9</text>
    <text x="272" y="260">10</text>
    <text x="320" y="260">11</text>
  </g>

  <!-- 抽出行：落到下方结果条 -->
  <line x1="248" y1="280" x2="248" y2="326" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 结果：单独一行，无外层框（维度消失） -->
  <g fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5">
    <rect x="156" y="330" width="40" height="40" rx="9"/>
    <rect x="204" y="330" width="40" height="40" rx="9"/>
    <rect x="252" y="330" width="40" height="40" rx="9"/>
    <rect x="300" y="330" width="40" height="40" rx="9"/>
  </g>
  <g font-size="18" font-weight="600" fill="#1e40af" text-anchor="middle">
    <text x="176" y="354">8</text>
    <text x="224" y="354">9</text>
    <text x="272" y="354">10</text>
    <text x="320" y="354">11</text>
  </g>
  <text class="cap" x="248" y="404">结果 (4,)：剥掉一层括号，维度消失</text>

  <!-- ══════════ 面板 R：a[1:] 切片 → 括号原样 ══════════ -->
  <text class="lbl" x="552" y="100">a[1:]：切片取遍历</text>

  <g fill="#f8fafc" stroke="#334155" stroke-width="2.5">
    <rect x="460" y="140" width="40" height="40" rx="9"/>
    <rect x="508" y="140" width="40" height="40" rx="9"/>
    <rect x="556" y="140" width="40" height="40" rx="9"/>
    <rect x="604" y="140" width="40" height="40" rx="9"/>
  </g>
  <g fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5">
    <rect x="460" y="188" width="40" height="40" rx="9"/>
    <rect x="508" y="188" width="40" height="40" rx="9"/>
    <rect x="556" y="188" width="40" height="40" rx="9"/>
    <rect x="604" y="188" width="40" height="40" rx="9"/>
    <rect x="460" y="236" width="40" height="40" rx="9"/>
    <rect x="508" y="236" width="40" height="40" rx="9"/>
    <rect x="556" y="236" width="40" height="40" rx="9"/>
    <rect x="604" y="236" width="40" height="40" rx="9"/>
  </g>
  <g font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">
    <text x="480" y="164">0</text>
    <text x="528" y="164">1</text>
    <text x="576" y="164">2</text>
    <text x="624" y="164">3</text>
  </g>
  <g font-size="18" font-weight="600" fill="#1d4ed8" text-anchor="middle">
    <text x="480" y="212">4</text>
    <text x="528" y="212">5</text>
    <text x="576" y="212">6</text>
    <text x="624" y="212">7</text>
    <text x="480" y="260">8</text>
    <text x="528" y="260">9</text>
    <text x="576" y="260">10</text>
    <text x="624" y="260">11</text>
  </g>

  <!-- 抽出行段：落到下方结果块 -->
  <line x1="552" y1="280" x2="552" y2="318" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 结果：两行整体，虚线外框示意「外层括号还在」 -->
  <g fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5">
    <rect x="460" y="330" width="40" height="40" rx="9"/>
    <rect x="508" y="330" width="40" height="40" rx="9"/>
    <rect x="556" y="330" width="40" height="40" rx="9"/>
    <rect x="604" y="330" width="40" height="40" rx="9"/>
    <rect x="460" y="378" width="40" height="40" rx="9"/>
    <rect x="508" y="378" width="40" height="40" rx="9"/>
    <rect x="556" y="378" width="40" height="40" rx="9"/>
    <rect x="604" y="378" width="40" height="40" rx="9"/>
  </g>
  <rect x="450" y="321" width="204" height="106" rx="14" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="7 5"/>
  <g font-size="18" font-weight="600" fill="#1e40af" text-anchor="middle">
    <text x="480" y="354">4</text>
    <text x="528" y="354">5</text>
    <text x="576" y="354">6</text>
    <text x="624" y="354">7</text>
    <text x="480" y="402">8</text>
    <text x="528" y="402">9</text>
    <text x="576" y="402">10</text>
    <text x="624" y="402">11</text>
  </g>
  <text class="cap" x="552" y="452">结果 (2, 4)：行段原样搬走，外层括号还在</text>
</svg>
