<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .val { font-size: 26px; font-weight: 600; fill: #64748b; text-anchor: middle; }
    .pick { font-size: 26px; font-weight: 600; fill: #1d4ed8; text-anchor: middle; }
    .res { font-size: 26px; font-weight: 600; fill: #1e40af; text-anchor: middle; }
    .cm { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2.5; rx: 14; }
    .cp { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; rx: 14; }
    .cr { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2.5; rx: 14; }
  </style>

  <rect x="0" y="0" width="1280" height="720" fill="#f8fafc"/>

  <!-- ═══ 源网格：2×3（行 y199-271 / y289-361，列 x442-514 / 530-602 / 618-690）═══ -->
  <!-- 未选中列 c1、c2 置灰 -->
  <g class="cm">
    <rect x="442" y="199" width="72" height="72"/>
    <rect x="530" y="199" width="72" height="72"/>
    <rect x="442" y="289" width="72" height="72"/>
    <rect x="530" y="289" width="72" height="72"/>
  </g>
  <g class="val">
    <text x="478" y="242">0</text>
    <text x="566" y="242">1</text>
    <text x="478" y="332">3</text>
    <text x="566" y="332">4</text>
  </g>

  <!-- 选中列 c3（被切走的一列）高亮 -->
  <g class="cp">
    <rect x="618" y="199" width="72" height="72"/>
    <rect x="618" y="289" width="72" height="72"/>
  </g>
  <g class="pick">
    <text x="654" y="242">2</text>
    <text x="654" y="332">5</text>
  </g>

  <!-- 取出箭头：第 3 列 → 右侧结果列 -->
  <g stroke="#64748b" stroke-width="2.5" fill="none">
    <line x1="690" y1="235" x2="756" y2="235" marker-end="url(#arr)"/>
    <line x1="690" y1="325" x2="756" y2="325" marker-end="url(#arr)"/>
  </g>

  <!-- 结果列 [2 5]，与源行同高度对齐 -->
  <g class="cr">
    <rect x="758" y="199" width="72" height="72"/>
    <rect x="758" y="289" width="72" height="72"/>
  </g>
  <g class="res">
    <text x="794" y="242">2</text>
    <text x="794" y="332">5</text>
  </g>

  <!-- 底部代码注释（标题带 y416-469 之外） -->
  <text x="640" y="508" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="600" fill="#64748b" text-anchor="middle">a[:, 2]  # 把一整列取出来 → [2 5]</text>
</svg>
