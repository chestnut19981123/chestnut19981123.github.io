<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .lbl { font-size: 22px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
    .val { font-size: 21px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
    .idx { font-size: 16px; font-weight: 600; fill: #64748b; text-anchor: middle; }
    .cap { font-size: 15px; fill: #64748b; text-anchor: middle; }
    .ial { font-size: 16px; font-weight: 600; fill: #64748b; text-anchor: end; }
  </style>

  <!-- ══════════ 面板 A：axis=0 逐列求和 ══════════ -->
  <text class="lbl" x="244" y="120">axis=0 · 逐列求和</text>

  <!-- 列标 j=0..2 -->
  <text class="idx" x="180" y="144">j=0</text>
  <text class="idx" x="244" y="144">j=1</text>
  <text class="idx" x="308" y="144">j=2</text>

  <!-- 行标 i=0/1 -->
  <text class="ial" x="146" y="184">i=0</text>
  <text class="ial" x="146" y="248">i=1</text>

  <!-- 2×3 数组 [[0,1,2],[3,4,5]]：cell x 154/218/282.. -->
  <g fill="#f8fafc" stroke="#334155" stroke-width="2.5">
    <rect x="154" y="152" width="52" height="52" rx="10"/>
    <rect x="218" y="152" width="52" height="52" rx="10"/>
    <rect x="282" y="152" width="52" height="52" rx="10"/>
    <rect x="154" y="216" width="52" height="52" rx="10"/>
    <rect x="218" y="216" width="52" height="52" rx="10"/>
    <rect x="282" y="216" width="52" height="52" rx="10"/>
  </g>
  <g class="val">
    <text x="180" y="185">0</text>
    <text x="244" y="185">1</text>
    <text x="308" y="185">2</text>
    <text x="180" y="249">3</text>
    <text x="244" y="249">4</text>
    <text x="308" y="249">5</text>
  </g>

  <!-- 聚合箭头：每列向下压到结果块 -->
  <g stroke="#64748b" stroke-width="2.5" fill="none">
    <line x1="180" y1="268" x2="180" y2="334" marker-end="url(#arr)"/>
    <line x1="244" y1="268" x2="244" y2="334" marker-end="url(#arr)"/>
    <line x1="308" y1="268" x2="308" y2="334" marker-end="url(#arr)"/>
  </g>

  <!-- 结果行 [3 5 7] -->
  <g fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5">
    <rect x="154" y="336" width="52" height="52" rx="10"/>
    <rect x="218" y="336" width="52" height="52" rx="10"/>
    <rect x="282" y="336" width="52" height="52" rx="10"/>
  </g>
  <g class="val">
    <text x="180" y="369">3</text>
    <text x="244" y="369">5</text>
    <text x="308" y="369">7</text>
  </g>
  <text class="cap" x="244" y="418">axis=0 → [3 5 7]</text>

  <!-- ══════════ 面板 B：axis=1 逐行求和 ══════════ -->
  <text class="lbl" x="552" y="120">axis=1 · 逐行求和</text>

  <text class="idx" x="436" y="144">j=0</text>
  <text class="idx" x="500" y="144">j=1</text>
  <text class="idx" x="564" y="144">j=2</text>

  <text class="ial" x="402" y="184">i=0</text>
  <text class="ial" x="402" y="248">i=1</text>

  <g fill="#f8fafc" stroke="#334155" stroke-width="2.5">
    <rect x="410" y="152" width="52" height="52" rx="10"/>
    <rect x="474" y="152" width="52" height="52" rx="10"/>
    <rect x="538" y="152" width="52" height="52" rx="10"/>
    <rect x="410" y="216" width="52" height="52" rx="10"/>
    <rect x="474" y="216" width="52" height="52" rx="10"/>
    <rect x="538" y="216" width="52" height="52" rx="10"/>
  </g>
  <g class="val">
    <text x="436" y="185">0</text>
    <text x="500" y="185">1</text>
    <text x="564" y="185">2</text>
    <text x="436" y="249">3</text>
    <text x="500" y="249">4</text>
    <text x="564" y="249">5</text>
  </g>

  <!-- 聚合箭头：每行向右压到结果块 -->
  <g stroke="#64748b" stroke-width="2.5" fill="none">
    <line x1="590" y1="178" x2="640" y2="178" marker-end="url(#arr)"/>
    <line x1="590" y1="242" x2="640" y2="242" marker-end="url(#arr)"/>
  </g>

  <!-- 结果列 [3 12] -->
  <g fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5">
    <rect x="642" y="152" width="52" height="52" rx="10"/>
    <rect x="642" y="216" width="52" height="52" rx="10"/>
  </g>
  <g class="val">
    <text x="668" y="185">3</text>
    <text x="668" y="249">12</text>
  </g>
  <text class="cap" x="668" y="418">axis=1 → [3 12]</text>
</svg>
